}
function renderEntryUnit(r){const w=$('er-unit-'+r.id);if(w)w.innerHTML=unitButtons(r.storeId,'entrySetStore',{arg:r.id,small:true})+(r.why?`<div class="guess-note" style="margin:4px 0 0">${esc(r.why)}</div>`:'');entryTotal()}
function entrySetStore(storeId,rowId){const r=EN.rows.find(x=>x.id===rowId);if(!r)return;r.storeId=storeId;r.picked=true;r.why='';rememberStore(storeId);renderEntryUnit(r)}
async function entryVendorChanged(rowId){
  const r=EN.rows.find(x=>x.id===rowId);if(!r||myStores().length<=1)return;
  r.vendor=$('er-ven-'+rowId).value.trim();
  if(r.picked||!r.vendor)return;
  const g=await guessStore(r.vendor,[]);
  if(g.id&&!r.picked){r.storeId=g.id;r.why=g.why?`→ ${unitLabel(storeById(g.id))}（${g.why}）`:'';renderEntryUnit(r)}
}
function entryAdd(){
  collectEntryRows();const r=newEntryRow();EN.rows.push(r);
  $('en-rows').insertAdjacentHTML('beforeend',entryRowHtml(r));
  setTimeout(()=>$('er-amt-'+r.id)?.focus(),50);
}
function entryDel(id){collectEntryRows();EN.rows=EN.rows.filter(r=>r.id!==id);if(!EN.rows.length)EN.rows=[newEntryRow()];renderEntry()}
function entryTotal(){
  let t=0;const by={};
  EN.rows.forEach(r=>{const v=normAmount($('er-amt-'+r.id)?.value)||0;t+=v;if(v)by[r.storeId]=(by[r.storeId]||0)+v});
  if($('en-total'))$('en-total').textContent=yen(t);
  if($('en-split'))$('en-split').textContent=myStores().length>1&&Object.keys(by).length?Object.entries(by).map(([id,v])=>unitLabel(storeById(id))+' '+yen(v)).join(' ・ '):'';
}
// 取引先の候補：担当のお店で使ったことのある名前だけ
async function loadVendorCandidates(){
  if(!EN.vendors){
    try{
      const rows=await db.get('expenses?select=vendor_name'+inStores(myStores().map(s=>s.id))+'&vendor_name=not.is.null&order=created_at.desc&limit=1500');
      const cnt={};rows.forEach(r=>{const v=(r.vendor_name||'').trim();if(v)cnt[v]=(cnt[v]||0)+1});
      EN.vendors=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
    }catch(e){EN.vendors=[]}
  }
  const dl=$('vendor-list');if(dl)dl.innerHTML=EN.vendors.map(v=>`<option value="${esc(v)}">`).join('');
}
async function entrySave(){
  collectEntryRows();
  const items=EN.rows.map(r=>({...r,amt:normAmount(r.amount),vendor:(r.vendor||'').trim()})).filter(r=>r.amt||r.vendor);
  const st=$('en-status');
  if(!items.length){st.innerHTML='<div class="alert alert-w">金額とお店を入れた行がありません</div>';return}
  const bad=items.find(r=>!r.amt||!r.vendor||!r.date||!r.storeId);
  if(bad){st.innerHTML='<div class="alert alert-w">日付・金額・お店のどれかが空いている行があります</div>';$('er-'+bad.id)?.scrollIntoView({behavior:'smooth',block:'center'});return}
  const btn=$('en-save');btn.disabled=true;
  let ok=0,ng=0;const by={};
  for(let i=0;i<items.length;i++){
    const r=items[i];btn.textContent=`登録しています... (${i+1}/${items.length})`;
    try{
      // お店を自分でえらばず、名前の確定前に保存した行もここでよそう
      if(!r.picked&&myStores().length>1&&!r.why){const g=await guessStore(r.vendor,[]);if(g.id)r.storeId=g.id}
      const cat=await guessCategory(r.vendor);
      await db.post('expenses',{store_id:r.storeId,doc_type:'manual',vendor_name:r.vendor,date:r.date,total:r.amt,
        payment_method:EN.pay,department_id:guessDept(r.storeId,[r.vendor]),category_id:cat,status:'pending',created_by:S.user.username});
      forgetStoreGuess(r.vendor);by[r.storeId]=(by[r.storeId]||0)+1;
      ok++;
    }catch(e){ng++}
  }
  EN.vendors=null;EN.done=true;EN.rows=[];
  $('page-entry').innerHTML=pageHead('経費を手で入力','')+`<div style="text-align:center;padding:24px 0">
    <div style="font-size:52px">✅</div><div style="font-size:20px;font-weight:700;color:var(--green);margin:6px 0">${ok}件 登録しました</div>
    ${myStores().length>1?`<div class="hint">${Object.entries(by).map(([id,n])=>esc(unitLabel(storeById(id)))+' '+n+'件').join(' ・ ')}</div>`:''}
    ${ng?`<div class="alert alert-w">${ng}件は登録できませんでした</div>`:''}
    <div class="hint" style="margin:6px 0 14px">経費の種類はAIがえらびました。一覧でいつでも直せます。</div>
    <div class="btn-col"><button class="btn btn-primary" onclick="PAGES.entry()">続けて入力する</button><button class="btn btn-secondary" onclick="go('list','pending')">経費の一覧を見る</button></div></div>`;
  toast(ok+'件 登録しました','ok');
}
</script>
<script>
// ===== LIST（経費の一覧・確認・修正） =====
const LI={status:'all',month:null,q:'',rows:[],loaded:false,unit:'all'};
// 一覧で使う列だけ取る（AIの生データなど重い列は取らない）
const LIST_COLS='id,store_id,department_id,category_id,vehicle_id,vendor_name,total,date,payment_method,memo,status,doc_type,image_url,created_by,created_at,card_last4';
const STATUS_LABEL={pending:'確認待ち',approved:'確認ずみ',check:'要確認'};
PAGES.list=async function(arg){
  if(arg==='pending'){LI.status='pending';LI.month='all'}
  if(!LI.month)LI.month=ym();
  $('page-list').innerHTML=pageHead('経費の一覧','')+skel('list');
  try{LI.rows=await fetchExpenses(ctxStoreIds(),null,null,LIST_COLS)}catch(e){LI.rows=[];toast('読み込みに失敗しました','err')}
  if(S.page!=='list')return;
  renderList();
};
function listFiltered(skip={}){
  const q=LI.q.trim().toLowerCase();
  return LI.rows.filter(e=>{
    if(!skip.status&&LI.status!=='all'&&e.status!==LI.status)return false;
    if(LI.unit!=='all'&&e.store_id!==LI.unit)return false;
    if(!skip.month&&LI.month==='none'&&e.date)return false;
    if(!skip.month&&LI.month!=='all'&&LI.month!=='none'&&!(e.date||'').startsWith(LI.month))return false;
    if(!skip.q&&q&&!((e.vendor_name||'')+' '+(e.memo||'')+' '+(catById(e.category_id)?.name||'')).toLowerCase().includes(q))return false;
    return true;
  });
}
function renderList(){
  const months=[...new Set([ym(),(LI.month==='all'||LI.month==='none')?null:LI.month,...LI.rows.map(e=>(e.date||'').slice(0,7))].filter(Boolean))].sort().reverse();
  const base=listFiltered({status:true,q:true});
  const counts={all:base.length};['pending','approved','check'].forEach(s=>counts[s]=base.filter(e=>e.status===s).length);
  let h=`<div class="page-head"><button class="back-btn" onclick="go('home')" aria-label="ホームへ">‹</button><div class="page-title">経費の一覧</div><button class="btn btn-primary btn-small" onclick="go('entry')">＋ 手で入力</button></div>
  <div class="page-sub">${esc(ctxLabel().name)}</div>
  ${myStores().length>1?`<div class="seg">${[['all','ぜんぶ']].concat(myStores().map(s=>[s.id,unitIcon(s)+' '+unitLabel(s)])).map(([k,l])=>`<button class="${LI.unit===k?'active':''}" onclick="LI.unit='${k}';renderList()">${esc(l)}</button>`).join('')}</div>`:''}
  <div class="seg">${[['all','すべて'],['pending','確認待ち'],['approved','確認ずみ'],['check','要確認']].map(([k,l])=>`<button class="${LI.status===k?'active':''}" onclick="LI.status='${k}';renderList()">${l} ${counts[k]}</button>`).join('')}</div>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <select class="input" style="width:auto;flex-shrink:0" onchange="LI.month=this.value;renderList()"><option value="all" ${LI.month==='all'?'selected':''}>すべての月</option>${months.map(m=>{const n=LI.rows.filter(e=>(LI.unit==='all'||e.store_id===LI.unit)&&(e.date||'').startsWith(m)).length;return `<option value="${m}" ${m===LI.month?'selected':''}>${monthLabel(m)}（${n}件）</option>`}).join('')}${LI.rows.some(e=>!e.date)?`<option value="none" ${LI.month==='none'?'selected':''}>日付なし（${LI.rows.filter(e=>!e.date&&(LI.unit==='all'||e.store_id===LI.unit)).length}件）</option>`:''}</select>
    <input class="input" type="search" placeholder="お店・メモでさがす" value="${esc(LI.q)}" oninput="LI.q=this.value;renderListBody()" style="flex:1;min-width:0"/>
  </div>
  <div id="list-body"></div>`;
  $('page-list').innerHTML=h;
  renderListBody();
}
function renderListBody(){
  const list=listFiltered();
  const multi=ctxStores().length>1;
  const total=sum(list,e=>e.total||0);
  let h='';
  const pend=list.filter(e=>e.status==='pending');
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="hint">${list.length}件</span><span style="font-weight:700" class="num">合計 ${yen(total)}</span></div>`;
  if(pend.length>1)h+=`<button class="btn btn-secondary" style="margin-bottom:12px" onclick="approveAll()">表示中の確認待ち ${pend.length}件 をまとめて「確認ずみ」にする</button>`;
  if(!list.length){
    const other=listFiltered({month:true});
    let msg='<div class="empty">該当する経費はありません</div>';
    if(LI.month!=='all'&&other.length){
      const ms=[...new Set(other.map(e=>e.date?monthLabel(e.date.slice(0,7)):'日付なし'))].slice(0,3).join('・');
      msg=`<div class="alert alert-i" style="text-align:center">${LI.month==='none'?'日付なしの経費':esc(monthLabel(LI.month))+'の経費'}はありません。<br>ほかに <b>${other.length}件</b> あります（${esc(ms)}）<br><button class="btn btn-primary" style="margin-top:10px" onclick="LI.month='all';renderList()">すべての月を見る</button></div>`;
    }
    $('list-body').innerHTML=h+msg;return;
  }
  let lastDate=null;h+='<div class="card" style="padding:2px 14px">';
  list.forEach(e=>{
    if(e.date!==lastDate){
      if(lastDate!==null)h+='</div><div class="card" style="padding:2px 14px">';
      h+=`<div style="font-size:12px;font-weight:700;color:var(--text2);padding:10px 0 2px">${dateLabel(e.date)}</div>`;lastDate=e.date;
    }
    const cat=catById(e.category_id),dept=deptById(e.department_id),st=storeById(e.store_id);
    const pill=e.status==='approved'?'<span class="pill pill-a">確認ずみ</span>':e.status==='check'?'<span class="pill pill-c">要確認</span>':'<span class="pill pill-p">確認待ち</span>';
    h+=`<div class="row tap" onclick="openExpense('${e.id}')">
      <div class="row-main"><div class="row-title">${esc(e.vendor_name||'お店不明')}</div>
        <div class="row-sub">${cat?`<span class="chip"><span class="dot" style="background:${esc(cat.color)}"></span>${esc(cat.name)}</span>`:'<span class="chip">種類なし</span>'}${dept?`<span class="chip">${esc(dept.name)}</span>`:''}${multi&&st?unitChip(st.id):''}${e.memo?`<span>${esc(e.memo)}</span>`:''}</div></div>
      <div class="row-right"><div class="amount">${e.total!=null?yen(e.total):'—'}</div><div style="margin-top:3px">${pill}</div></div>
      ${e.status!=='approved'?`<button class="icon-btn" style="color:var(--green);border-color:rgba(15,110,86,.3)" onclick="event.stopPropagation();approveOne('${e.id}')" aria-label="確認ずみにする" title="確認ずみにする"><svg viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M20 6L9 17l-5-5"/></svg></button>`:''}
    </div>`;
  });
  h+='</div>';
  $('list-body').innerHTML=h;
}
async function approveOne(id){
  try{await db.patch('expenses?id=eq.'+id,{status:'approved',updated_at:new Date().toISOString()});const e=LI.rows.find(x=>x.id===id);if(e)e.status='approved';renderList();toast('確認ずみにしました','ok')}
  catch(e){toast('できませんでした：'+e.message,'err')}
}
async function approveAll(){
  const ids=listFiltered().filter(e=>e.status==='pending').map(e=>e.id);
  if(!ids.length||!confirm(ids.length+'件をまとめて「確認ずみ」にしますか？'))return;
  try{
    for(let i=0;i<ids.length;i+=100)await db.patch(`expenses?id=in.(${ids.slice(i,i+100).join(',')})`,{status:'approved',updated_at:new Date().toISOString()});
    LI.rows.forEach(e=>{if(ids.includes(e.id))e.status='approved'});renderList();toast(ids.length+'件を確認ずみにしました','ok');
  }catch(e){toast('できませんでした：'+e.message,'err')}
}
// --- 1件の編集 ---
async function openExpense(id){
  const e=LI.rows.find(x=>x.id===id);if(!e)return;
  S.editExp=e;
  const storeSel=storeSelectHtml('ex-store',e.store_id,{all:isOwner(),onchange:'exStoreChanged()'});

    ${e.image_url?`<a data-sign="${esc(e.image_url)}" target="_blank" rel="noopener"><img class="doc-thumb" data-sign="${esc(e.image_url)}" alt="レシートの写真"/></a>`:''}
    <div class="field"><div class="label">金額</div><div class="yen-wrap"><span>¥</span><input class="input big num" id="ex-total" inputmode="numeric" value="${e.total??''}"/></div></div>
    <div class="field"><div class="label">お店・取引先</div><input class="input" id="ex-vendor" value="${esc(e.vendor_name||'')}"/></div>
    <div class="g2"><div class="field"><div class="label">日付</div><input class="input" type="date" id="ex-date" value="${esc(e.date||'')}"/></div>
      <div class="field"><div class="label">払い方</div>${paySelectHtml('ex-pay',e.payment_method)}</div></div>
    <div class="field"><div class="label">メモ</div><input class="input" id="ex-memo" value="${esc(e.memo||'')}"/></div>
    <div class="field"><div class="label">経費の種類</div>${catSelectHtml('ex-cat',e.category_id)}</div>
    ${myStores().length>1||isOwner()?`<div class="field"><div class="label">どのお店の経費？</div>${unitButtons(e.store_id,'exPickStore')}<div class="hidden">${storeSel}</div></div>`:`<div class="hidden">${storeSel}</div>`}
    <div id="ex-dept-wrap"></div>
    <div id="ex-veh-wrap"></div>
    <div class="field"><div class="label">状態</div><div class="seg" id="ex-status">${['pending','approved','check'].map(s=>`<button class="${e.status===s?'active':''}" data-v="${s}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${STATUS_LABEL[s]}</button>`).join('')}</div></div>
    <div class="btn-col"><button class="btn btn-primary" onclick="saveExpense()">保存する</button><button class="btn btn-danger" onclick="deleteExpense()">この経費を消す</button><button class="btn btn-secondary" onclick="closeSheet()">とじる</button></div>`);
  exStoreChanged(true);
}
function exPickStore(id){$('ex-store').value=id;document.querySelectorAll('#sheet .unit-btn').forEach(b=>{const on=b.getAttribute('onclick').includes(id);b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on)});exStoreChanged()}
async function exStoreChanged(first){
  const e=S.editExp;const sid=$('ex-store').value;
  const ds=deptSelectHtml('ex-dept',sid,first?e.department_id:guessDept(sid,[$('ex-vendor').value,$('ex-memo').value]));
  $('ex-dept-wrap').innerHTML=ds?`<div class="field"><div class="label">部門</div>${ds}</div>`:'';
  const biz=bizOfStore(sid);$('ex-veh-wrap').innerHTML='';
  if(biz?.track_vehicles){
    try{
      const vs=await db.get(`vehicles?select=id,maker,model,color,vehicle_number,status,deleted_at&store_id=eq.${sid}&order=created_at.desc&limit=300`);
      vs=vs.filter(v=>!v.deleted_at||v.id===e.vehicle_id);if(vs.length&&$('ex-veh-wrap'))$('ex-veh-wrap').innerHTML=`<div class="field"><div class="label">どの車の経費？（あれば）</div><select class="input" id="ex-veh"><option value="">なし</option>${vs.map(v=>`<option value="${v.id}" ${v.id===e.vehicle_id?'selected':''}>${esc([v.maker,v.model,v.color&&'('+v.color+')',v.vehicle_number&&'#'+v.vehicle_number].filter(Boolean).join(' '))}${v.status==='sold'?'（売却ずみ）':''}</option>`).join('')}</select></div>`;
    }catch(x){}
  }
}
async function saveExpense(){
  const e=S.editExp;
  const patch={
    total:normAmount($('ex-total').value),vendor_name:$('ex-vendor').value.trim()||null,date:$('ex-date').value||null,
    payment_method:$('ex-pay').value,memo:$('ex-memo').value.trim()||null,category_id:$('ex-cat').value||null,
    store_id:$('ex-store').value,department_id:$('ex-dept')?.value||null,vehicle_id:$('ex-veh')?.value||null,
    status:$('ex-status').querySelector('.active')?.dataset.v||e.status,updated_at:new Date().toISOString(),
  };
  if(!patch.total){toast('金額を入れてください','err');return}
  try{
    await db.patch('expenses?id=eq.'+e.id,patch);
    if(patch.category_id&&patch.vendor_name&&patch.category_id!==e.category_id)learnCategory(patch.vendor_name,patch.category_id);
    forgetStoreGuess(patch.vendor_name);
    Object.assign(e,patch);
    if(!ctxStoreIds().includes(e.store_id))LI.rows=LI.rows.filter(x=>x.id!==e.id);
    closeSheet();renderList();toast('保存しました','ok');
  }catch(x){toast('保存できませんでした：'+x.message,'err')}
}
async function deleteExpense(){
  const e=S.editExp;if(!confirm(`「${e.vendor_name||'この経費'}」${e.total!=null?yen(e.total):''} を消しますか？\n消すと元にもどせません。`))return;
  try{await db.del('expenses?id=eq.'+e.id);LI.rows=LI.rows.filter(x=>x.id!==e.id);closeSheet();renderList();toast('消しました')}
  catch(x){toast('消せませんでした：'+x.message,'err')}
}
</script>
<script>
// ===== DAILY（日計表：今日の売上・支出） =====
const DY={done:new Set(),storeId:null,date:null,report:null,ar:[],cashAuto:0,cashCount:0,cashOverride:false,loading:false,autoNote:''};
PAGES.daily=function(){
  const cs=ctxStores();
  if(S.dailyStoreId&&cs.some(s=>s.id===S.dailyStoreId)){DY.storeId=S.dailyStoreId;S.dailyStoreId=null}
  else DY.storeId=null; // 開くたびに「まだ入力していないお店」から始める
  DY.date=ymd();
  loadDaily();
};
function dailySwitch(id){DY.storeId=id;rememberStore(id);loadDaily()}
function dailyDate(d){if(!d)return;DY.date=d;loadDaily()}
function dailyMark(s){return DY.done.has(s.id)?'入力ずみ ✓':'まだ'}
async function loadDaily(){
  const el=$('page-daily');
  const mine=myStores();
  try{const d=await db.get(`daily_reports?select=store_id&date=eq.${DY.date}`+inStores(mine.map(s=>s.id)));DY.done=new Set(d.map(x=>x.store_id))}catch(e){DY.done=new Set()}
  if(!DY.storeId||!mine.some(s=>s.id===DY.storeId))DY.storeId=(mine.find(s=>!DY.done.has(s.id))||mine.find(s=>s.id===defaultEntryStoreId())||mine[0])?.id||null;
  const store=storeById(DY.storeId);
  if(!store){el.innerHTML=pageHead('今日の売上・支出','')+'<div class="alert alert-w">担当のお店がありません。</div>';return}
  el.innerHTML=pageHead('売上・支出の記録（日計表）',esc(store.icon||'')+' '+esc(store.name))+storePills(DY.storeId,'dailySwitch',dailyMark)+skel('form');
  DY.cashOverride=false;DY.autoNote='';
  const f=`&store_id=eq.${DY.storeId}&date=eq.${DY.date}`;
  try{
    const [rep,ar,cov,ex]=await Promise.all([
      db.get('daily_reports?select=*'+f+'&order=created_at.desc'),
      db.get('daily_ar_entries?select=*'+f+'&order=created_at').catch(()=>[]),
      db.get('restaurant_covers?select=*'+f).catch(()=>[]),
      db.get('expenses?select=total,payment_method'+f).catch(()=>[]),
    ]);
    DY.report=rep[0]||null;
    DY.ar=ar.map(a=>({key:uid(),client_id:a.client_id,client_name:a.client_name||'',amount:a.amount||0}));
    DY.covers=cov[0]||null;
    const cash=ex.filter(e=>isCashPay(e.payment_method));
    DY.cashAuto=sum(cash,e=>e.total||0);DY.cashCount=cash.length;
    if(DY.report&&DY.report.cash_expenses!=null&&DY.report.cash_expenses!==DY.cashAuto&&DY.report.cash_expenses>0)DY.cashOverride=true;
  }catch(e){toast('読み込みに失敗しました','err');DY.report=null;DY.ar=[];DY.covers=null}
  if(S.page!=='daily')return;
  renderDaily();
  if(!DY.report&&DY.date===ymd()&&store.carwash_store_id)fillFromReservations(true);
}
function dyInput(id,val,label,sub){
  return `<div class="d-row"><div class="d-label">${label}${sub?`<small>${sub}</small>`:''}</div><div class="yen-wrap"><span>¥</span><input class="d-input" id="${id}" inputmode="numeric" placeholder="0" value="${val?val:''}" oninput="calcDaily()"/></div></div>`;
}
function renderDaily(){
  const store=storeById(DY.storeId);const biz=bizOfStore(DY.storeId);const r=DY.report||{};

function dyNum(id){return int($(id)?.value)}
function calcDaily(){
  const store=storeById(DY.storeId);if(!store||!$('dy-income'))return;
  const card=dyNum('dy-card'),app=dyNum('dy-app');
  const income=dyNum('dy-cash')+card+app+dyNum('dy-other')+sum(DY.ar,a=>a.amount||0);
  const cardFee=Math.round(card*(store.card_fee_rate??3.24)/100),appFee=Math.round(app*(store.app_fee_rate??1.98)/100);
  const cashExp=DY.cashOverride?dyNum('dy-cashexp'):DY.cashAuto;
  const expense=cashExp+dyNum('dy-cardexp')+cardFee+appFee+dyNum('dy-otherexp');
  const bal=income-expense;
  $('dy-income').textContent=yen(income);$('dy-expense').textContent=yen(expense);
  $('dy-cardfee').textContent=yen(cardFee);$('dy-appfee').textContent=yen(appFee);
  $('dy-cashexp-auto').textContent=yen(DY.cashOverride?cashExp:DY.cashAuto);
  $('dy-cash-note').textContent=DY.cashOverride?'手で入力しています':(DY.cashCount?`この日の現金レシート ${DY.cashCount}件から自動`:'この日の現金レシートはまだありません');
  $('dy-cash-toggle').textContent=DY.cashOverride?'自動にもどす':'手でなおす';
  $('dy-balance').textContent=yen(bal);$('dy-balance').style.color=bal>=0?'var(--green)':'var(--red)';
  $('dy-bal-card').style.background=bal>=0?'var(--green-l)':'var(--red-l)';
}

async function saveDaily(){
  const btn=$('dy-save');btn.disabled=true;btn.textContent='保存しています...';
  const payload={store_id:DY.storeId,date:DY.date,
    cash_sales:dyNum('dy-cash'),card_sales:dyNum('dy-card'),app_sales:dyNum('dy-app'),other_income:dyNum('dy-other'),
    cash_expenses:DY.cashOverride?dyNum('dy-cashexp'):DY.cashAuto,card_expenses:dyNum('dy-cardexp'),other_expenses:dyNum('dy-otherexp'),
    memo:$('dy-memo').value.trim()||null,updated_at:new Date().toISOString()};
  try{
    // 同じ日・同じ店の記録は1つだけにする
    const ex=await db.get(`daily_reports?select=id&store_id=eq.${DY.storeId}&date=eq.${DY.date}&order=created_at`);
    let id;
    if(ex.length){id=ex[0].id;await db.patch('daily_reports?id=eq.'+id,payload);if(ex.length>1)await db.del(`daily_reports?id=in.(${ex.slice(1).map(x=>x.id).join(',')})`)}
    else{id=(await db.post('daily_reports',payload)).id}
    // 後払いは入れ直し（二重登録しない）
    await db.del(`daily_ar_entries?store_id=eq.${DY.storeId}&date=eq.${DY.date}`);
    const ar=DY.ar.filter(a=>a.amount>0).map(a=>({daily_report_id:id,store_id:DY.storeId,date:DY.date,client_id:a.client_id||null,client_name:a.client_name||null,amount:a.amount}));
    if(ar.length)await db.postMany('daily_ar_entries',ar);
    if(bizOfStore(DY.storeId)?.track_covers&&$('cv-lc')){
      const cp={store_id:DY.storeId,date:DY.date,lunch_covers:dyNum('cv-lc'),lunch_guests:dyNum('cv-lg'),lunch_sales:dyNum('cv-ls'),dinner_covers:dyNum('cv-dc'),dinner_guests:dyNum('cv-dg'),dinner_sales:dyNum('cv-ds'),updated_at:new Date().toISOString()};
      const ce=await db.get(`restaurant_covers?select=id&store_id=eq.${DY.storeId}&date=eq.${DY.date}`);
      if(ce.length)await db.patch('restaurant_covers?id=eq.'+ce[0].id,cp);else await db.post('restaurant_covers',cp);
    }
    rememberStore(DY.storeId);
    DY.report={...payload,id};
    toast('保存しました','ok');
    DY.done.add(DY.storeId);
    renderDaily();
    const next=myStores().find(s=>!DY.done.has(s.id));
    if(next&&DY.date===ymd())$('dy-save').insertAdjacentHTML('beforebegin',`<div class="alert alert-s">保存しました。<br><button class="btn btn-primary" style="margin-top:8px" onclick="dailySwitch('${next.id}');$('scroll').scrollTop=0">つぎは「${esc(unitLabel(next))}」の売上を入力 ›</button></div>`);
  }catch(e){toast('保存できませんでした：'+e.message,'err');btn.disabled=false;btn.textContent='保存する'}
}
// --- 日報PDF（お店ごとに1枚） ---
// A4縦1枚に収める：はみ出すときは少し縮小。それでも入らないほど経費が多いときは、
// 経費の明細を途中まで出して「ほか○件」にまとめる
function fitOnePage(build,total){
  const fr=$('print-frame');
  fr.style.cssText='display:block;position:fixed;left:-10000px;top:0;width:186mm;visibility:hidden';
  const probe=document.createElement('div');probe.style.cssText='height:273mm;width:1px';fr.appendChild(probe);
  const H=probe.getBoundingClientRect().height;probe.remove();
  const MIN=0.7;
  const measure=limit=>{fr.innerHTML=build(limit);return fr.firstElementChild.getBoundingClientRect().height};
  let limit=null,h=measure(null);
  if(h*MIN>H){ // 縮小しても入らない → 明細を減らす
    let lo=0,hi=total;
    while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(measure(mid)*MIN<=H)lo=mid;else hi=mid-1}
    limit=lo;h=measure(limit);
  }
  const z=Math.min(1,H/h);
  fr.style.cssText='';
  fr.firstElementChild.style.zoom=z<1?String(Math.floor(z*1000)/1000):'';
}
function dyScreenPayload(){
  return {cash_sales:dyNum('dy-cash'),card_sales:dyNum('dy-card'),app_sales:dyNum('dy-app'),other_income:dyNum('dy-other'),
    cash_expenses:DY.cashOverride?dyNum('dy-cashexp'):DY.cashAuto,card_expenses:dyNum('dy-cardexp'),other_expenses:dyNum('dy-otherexp'),
    memo:($('dy-memo')?.value||'').trim()||null};
}
function dyDirty(){
  const r=DY.report;if(!r)return true;const p=dyScreenPayload();
  return Object.keys(p).some(k=>(p[k]||0)!==(r[k]||0)&&!(k==='memo'&&(p[k]||'')===(r[k]||'')));
}

async function copyPrevDay(){
  const has=['dy-cash','dy-card','dy-app'].some(id=>dyNum(id)>0);
  if(has&&!confirm('いま入っている数字を、前の日の数字で上書きしますか？'))return;
  try{
    const rows=await db.get(`daily_reports?select=*&store_id=eq.${DY.storeId}&date=lt.${DY.date}&date=gte.${addDays(DY.date,-14)}&order=date.desc&limit=1`);
    if(!rows.length){toast('2週間以内に前の記録がありません');return}
    const p=rows[0];
    $('dy-cash').value=p.cash_sales||'';$('dy-card').value=p.card_sales||'';$('dy-app').value=p.app_sales||'';$('dy-other').value=p.other_income||'';
    $('dy-cardexp').value=p.card_expenses||'';$('dy-otherexp').value=p.other_expenses||'';
    calcDaily();toast(dateLabel(p.date)+'の数字をコピーしました（まだ保存していません）');
  }catch(e){toast('コピーできませんでした','err')}
}
async function fillFromReservations(silent){
  const store=storeById(DY.storeId);
  const d=await fetchReservations(store,DY.date);
  if(!d){if(!silent)toast('予約システムに接続できませんでした','err');return}
  if(!d.done.length){if(!silent)toast('この日の完了した予約はまだありません');return}
  if(!silent&&['dy-cash','dy-card'].some(id=>dyNum(id)>0)&&!confirm('現金とカードの売上を、予約の数字で上書きしますか？'))return;
  if(silent&&['dy-cash','dy-card'].some(id=>dyNum(id)>0))return;
  $('dy-cash').value=d.cash||'';$('dy-card').value=d.card||'';
  DY.autoNote=`🚿 予約システムから入れました（完了 ${d.done.length}件）。確かめて保存してください。`;
  $('dy-autonote').innerHTML=`<div class="alert alert-i" style="padding:8px 12px;font-size:13px">${esc(DY.autoNote)}</div>`;
  calcDaily();
}
async function dailyScan(){
  const f=await pickFile('cam');if(!f)return;
  openSheet('<div class="sheet-title">レジの紙を読み取り中...</div><div class="busy"><div class="spinner"></div><div class="busy-title">AIが数字を読んでいます</div></div>');
  try{
    const img=await compressImage(f);
    const r=await askClaude('read',imgContent(img,`これはレジの締めレシート・日報・売上集計表です。売上の数字を読み取りJSONだけを返してください。
{"cash_sales":null,"card_sales":null,"app_sales":null,"other_income":null,"total_sales":null,"note":"読んだ書類の種類など"}
- app_sales はPayPayなどQR・電子マネー・アプリ決済
- 内訳がわからなければ合計を cash_sales に入れる
- 金額は数字のみ。読めないものは null`),600);
    const v=k=>normAmount(r[k])||'';
    openSheet(`<div class="sheet-title">読み取れました</div><div class="sheet-sub">${esc(r.note||'')} 数字を確かめてから入れてください。</div>
      <div class="g2">
        <div class="field"><div class="label">現金</div><input class="input num" id="ds-cash" inputmode="numeric" value="${v('cash_sales')}"/></div>
        <div class="field"><div class="label">カード</div><input class="input num" id="ds-card" inputmode="numeric" value="${v('card_sales')}"/></div>
        <div class="field"><div class="label">アプリ</div><input class="input num" id="ds-app" inputmode="numeric" value="${v('app_sales')}"/></div>
        <div class="field"><div class="label">その他</div><input class="input num" id="ds-other" inputmode="numeric" value="${v('other_income')}"/></div>
      </div>
      <div class="btn-col"><button class="btn btn-primary" onclick="applyDailyScan()">この数字を入れる</button><button class="btn btn-secondary" onclick="closeSheet()">やめる</button></div>`);
  }catch(e){openSheet(`<div class="sheet-title">読み取れませんでした</div><div class="alert alert-d">${esc(e.message)}</div><button class="btn btn-secondary" onclick="closeSheet()">とじる</button>`)}
}
function applyDailyScan(){
  [['ds-cash','dy-cash'],['ds-card','dy-card'],['ds-app','dy-app'],['ds-other','dy-other']].forEach(([a,b])=>{const v=int($(a).value);if(v)$(b).value=v});
  closeSheet();calcDaily();toast('入れました。確かめて保存してください');
}
async function dailyHistory(){
  try{
    const rows=await db.get(`daily_reports?select=*&store_id=eq.${DY.storeId}&order=date.desc&limit=60`);
    const ar=rows.length?await db.get(`daily_ar_entries?select=date,amount&store_id=eq.${DY.storeId}&date=gte.${rows[rows.length-1].date}`).catch(()=>[]):[];
    openSheet(`<div class="sheet-title">これまでの記録</div><div class="sheet-sub">${esc(storeName(DY.storeId))} ・ タップでその日を開きます</div>`+(rows.length?rows.map(r=>{
      const inc=reportSales(r)+sum(ar.filter(a=>a.date===r.date),a=>a.amount||0);
      const exp=(r.cash_expenses||0)+(r.card_expenses||0)+(r.other_expenses||0)+feeOf(r);
      return `<div class="row tap" onclick="closeSheet();dailyDate('${r.date}')"><div class="row-main"><div class="row-title">${dateLabel(r.date)}</div><div class="row-sub">売上 ${yen(inc)} ・ 支出 ${yen(exp)}</div></div><div class="row-right"><div class="amount" style="color:${inc-exp>=0?'var(--green)':'var(--red)'}">${yen(inc-exp)}</div></div></div>`;
    }).join(''):'<div class="empty">まだ記録がありません</div>')+'<button class="btn btn-secondary" style="margin-top:12px" onclick="closeSheet()">とじる</button>');
  }catch(e){toast('読み込めませんでした','err')}
}
</script>
<script>
// ===== REPORT（売上レポート） =====
const RP={month:null,tab:'sum',data:null,unit:'all'};
// レポートの中だけで使う「どこの数字？」（ぜんぶ／事業／お店）
function rpOptions(){
  const o=[['all','ぜんぶ','🏢']];
  myTree().forEach(g=>{
    if(g.biz&&g.stores.length>1){o.push(['biz:'+g.biz.id,g.biz.name+'（ぜんぶ）',g.biz.icon||'🏢']);g.stores.forEach(st=>o.push([st.id,st.name,unitIcon(st)]))}
    else g.stores.forEach(st=>o.push([st.id,unitLabel(st),unitIcon(st)]));
  });
  return o;
}
function rpStores(){
  const mine=myStores();const u=RP.unit;
  if(u==='all')return mine;
  if(u.startsWith('biz:'))return mine.filter(st=>st.business_id===u.slice(4));
  return mine.filter(st=>st.id===u);
}
const rpIds=()=>rpStores().map(st=>st.id);
function rpSingle(){const a=rpStores();return a.length===1?a[0]:null}
function rpLabel(){return (rpOptions().find(o=>o[0]===RP.unit)||['','ぜんぶ'])[1]}
function rpSet(u){RP.unit=u;renderReportShell();loadReport();$('scroll').scrollTop=0}
function openReportUnit(u){RP.unit=u;RP.tab='sum';go('report')}
const RP_TABS=[['sum','まとめ'],['day','日ごと'],['week','曜日'],['ar','後払い'],['goal','目標'],['next','来月の予想']];
PAGES.report=function(arg){
  if(!RP.month)RP.month=ym();
  if(!rpOptions().some(o=>o[0]===RP.unit))RP.unit='all';
  if(arg)RP.tab=arg;
  renderReportShell();loadReport();
};
function renderReportShell(){
  const months=[];for(let i=0;i<13;i++)months.push(addMonths(ym(),-i));
  const opts=rpOptions();
  $('page-report').innerHTML=pageHead('売上レポート','')+
    (opts.length>2?`<div class="seg">${opts.map(([k,l,i])=>`<button class="${RP.unit===k?'active':''}" onclick="rpSet('${k}')">${esc(i)} ${esc(l)}</button>`).join('')}</div>`:'')+
    `<div class="tabs">${RP_TABS.map(([k,l])=>`<button class="${RP.tab===k?'active':''}" onclick="RP.tab='${k}';renderReportShell();renderReportTab()">${l}</button>`).join('')}</div>
    ${['sum','day','ar','goal'].includes(RP.tab)?`<select class="input" style="margin-bottom:12px" onchange="RP.month=this.value;loadReport()">${months.map(m=>`<option value="${m}" ${m===RP.month?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>`:''}
    <div id="rp-body">${skel('report')}</div>`;
}
async function loadReport(){
  const ids=rpIds();const m=RP.month,pm=addMonths(m,-1);
  if($('rp-body'))$('rp-body').innerHTML=skel('report');
  try{
    const [ex,sales,pex,psales]=await Promise.all([
      fetchExpenses(ids,monthStart(m),monthEnd(m)),
      fetchSales(ids,monthStart(m),monthEnd(m)),
      fetchExpenses(ids,monthStart(pm),monthEnd(pm),'total,store_id'),
      fetchSales(ids,monthStart(pm),monthEnd(pm)),
    ]);
    RP.data={ids,m,ex,sales,pex,psales};
  }catch(e){RP.data=null;if($('rp-body'))$('rp-body').innerHTML=`<div class="alert alert-d">集計できませんでした：${esc(e.message)}</div>`;return}
  if(S.page==='report')renderReportTab();
}
function renderReportTab(){
  if(!$('rp-body'))return;
  if(RP.tab==='week')return reportWeek();
  if(RP.tab==='next')return reportNext();
  if(!RP.data){loadReport();return}
  ({sum:reportSum,day:reportDay,ar:reportAr,goal:reportGoal})[RP.tab]();
}
// --- チャート部品（タップ/ホバーで数字が出る） ---
function barChart(labels,series,opt={}){
  const id='ch'+uid();
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>Math.max(0,v||0))));
  const cols=labels.map((l,i)=>{
    const tip=(opt.tipLabel?opt.tipLabel(i):l)+'　'+series.map(s=>`${s.name} <b>${yen(s.values[i]||0)}</b>`).join('　');
    return `<div class="bar-col" data-tip="${esc(tip)}" onclick="chartTip('${id}',this)" onmouseenter="chartTip('${id}',this)">${series.map(s=>`<div class="bar" style="height:${Math.round(Math.max(0,s.values[i]||0)/max*100)}%;background:${s.color}"></div>`).join('')}</div>`;
  }).join('');
  const every=opt.labelEvery||1;
  return `<div class="chart-readout" id="${id}">${esc(opt.hint||'棒をタップすると金額が出ます')}</div>
    <div class="bars" style="height:${opt.height||120}px">${cols}</div>
    <div class="bar-labels">${labels.map((l,i)=>`<div>${i%every===0||i===labels.length-1?esc(l):''}</div>`).join('')}</div>
    ${series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}`;
}
function chartTip(id,el){const r=$(id);if(r)r.innerHTML=el.dataset.tip;el.parentNode.querySelectorAll('.bar-col').forEach(c=>c.style.opacity=c===el?1:.55)}
function hbars(rows,color,max){
  max=max||Math.max(1,...rows.map(r=>r[1]));
  return rows.map(([l,v])=>`<div class="hbar-row"><div class="hbar-label" title="${esc(l)}">${esc(l)}</div><div class="hbar-bg"><div class="hbar" style="width:${Math.max(1,Math.round(v/max*100))}%;background:${color}"></div></div><div class="hbar-val">${yen(v)}</div></div>`).join('');
}
function diffBadge(cur,prev){
  if(!prev)return '';
  const p=Math.round((cur-prev)/Math.abs(prev)*100);
  return `<div class="stat-note">先月より ${p>=0?'+':''}${p}%</div>`;
}
// --- まとめ ---
function reportSum(){
  const {ex,sales,pex,psales,m}=RP.data;
  const sl=salesTotal(sales),xp=expenseTotal(ex),pr=sl-xp;
  const psl=salesTotal(psales),pxp=expenseTotal(pex);
  let h=`<div class="stat-row">
      <div class="stat"><div class="stat-label">売上</div><div class="stat-value" style="color:var(--sales)">${yen(sl)}</div>${diffBadge(sl,psl)}</div>
      <div class="stat"><div class="stat-label">経費</div><div class="stat-value" style="color:var(--expense)">${yen(xp)}</div>${diffBadge(xp,pxp)}</div>
    </div>
    <div class="stat" style="margin-bottom:12px"><div class="stat-label">手元に残る（利益）</div><div class="stat-value" style="color:${pr>=0?'var(--green)':'var(--red)'};font-size:26px">${yen(pr)}</div><div class="stat-note">先月の利益 ${yen(psl-pxp)}</div></div>`;
  if(sales.reports.length===0)h+=`<div class="alert alert-w">${monthLabel(m)}の売上がまだ入力されていません。「今日の売上を入力」から記録できます。</div>`;
  // 事業ごと／店舗ごと
  const stores=rpStores();const tree=myTree().filter(g=>g.stores.some(s=>stores.includes(s)));
  const unitRow=(ico,color,name,sids,act)=>{const f=r=>sids.includes(r.store_id);const a=salesTotal(sales,f),b=expenseTotal(ex,f);
    return `<div class="unit-card" ${act?`onclick="${act}"`:''}><div class="unit-ico" style="background:${esc(color)}22">${esc(ico)}</div><div class="row-main"><div class="row-title">${esc(name)}</div><div class="row-sub">売上 ${yen(a)} ・ 経費 ${yen(b)}</div></div><div class="row-right"><div class="amount" style="color:${a-b>=0?'var(--green)':'var(--red)'}">${yen(a-b)}</div><div class="hint">利益</div></div></div>`};
  if(RP.unit==='all'&&tree.filter(g=>g.biz).length>1){
    h+=`<div class="card"><div class="card-title">事業ごと <span class="hint">タップでくわしく</span></div>`+tree.map(g=>{const sids=g.stores.map(s=>s.id).filter(id=>stores.some(s=>s.id===id));const b=g.biz||{icon:'📁',color:'#888',name:'事業なし'};
      return unitRow(b.icon||'🏢',b.color,b.name,sids,g.biz?(sids.length>1?`rpSet('biz:${g.biz.id}')`:`rpSet('${sids[0]}')`):'')}).join('')+'</div>';
  }else if(stores.length>1){
    h+=`<div class="card"><div class="card-title">お店ごと <span class="hint">タップでくわしく</span></div>`+stores.map(s=>unitRow(s.icon||'🏪',s.color,s.name,[s.id],`rpSet('${s.id}')`)).join('')+'</div>';
  }
  // 入金の内訳
  const rs=sales.reports;
  h+=`<div class="card"><div class="card-title">売上の内訳</div>
    ${[['現金',sum(rs,r=>r.cash_sales||0)],['カード',sum(rs,r=>r.card_sales||0)],['アプリ',sum(rs,r=>r.app_sales||0)],['その他の入金',sum(rs,r=>r.other_income||0)],['後払い',sum(sales.ar,a=>a.amount||0)]].map(([l,v])=>`<div class="kv"><span>${l}</span><span>${yen(v)}</span></div>`).join('')}
    <div class="kv"><span>売上を記録した日（お店ごとの合計）</span><span>${new Set(rs.map(r=>r.date+'|'+r.store_id)).size}日分</span></div></div>`;
  // 経費の種類別
  const byCat={};ex.forEach(e=>{const k=catById(e.category_id)?.name||'種類なし';byCat[k]=(byCat[k]||0)+(e.total||0)});
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  h+=`<div class="card"><div class="card-title">経費の種類ごと</div>${catRows.length?hbars(catRows,'var(--expense)'):'<div class="empty">経費がありません</div>'}</div>`;
  // 取引先ランキング
  const byV={};ex.forEach(e=>{const k=e.vendor_name||'不明';byV[k]=(byV[k]||0)+(e.total||0)});
  const vRows=Object.entries(byV).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(vRows.length)h+=`<div class="card"><div class="card-title">お金をたくさん払った相手</div>${hbars(vRows,'var(--expense)')}</div>`;
  // 部門別（1店舗のとき）
  const one=rpSingle();
  if(one){
    const ds=S.depts.filter(d=>d.store_id===one.id);
    if(ds.length){const rows=ds.map(d=>[d.name,expenseTotal(ex,e=>e.department_id===d.id)]);rows.push(['部門なし',expenseTotal(ex,e=>!e.department_id||!ds.some(d=>d.id===e.department_id))]);
      h+=`<div class="card"><div class="card-title">部門ごとの経費</div>${hbars(rows,'var(--expense)')}</div>`}
    if(bizOfStore(one.id)?.track_covers)h+='<div id="rp-covers"></div>';
  }
  $('rp-body').innerHTML=h;
  if(one&&bizOfStore(one.id)?.track_covers)reportCovers(one);
}
async function reportCovers(store){
  const m=RP.month;
  try{
    const cv=await db.get(`restaurant_covers?select=*&store_id=eq.${store.id}&date=gte.${monthStart(m)}&date=lte.${monthEnd(m)}`);
    const lc=sum(cv,c=>c.lunch_covers||0),lg=sum(cv,c=>c.lunch_guests||0),ls=sum(cv,c=>c.lunch_sales||0);
    const dc=sum(cv,c=>c.dinner_covers||0),dg=sum(cv,c=>c.dinner_guests||0),ds=sum(cv,c=>c.dinner_sales||0);
    const n=cv.length;const per=(v,k)=>k?yen(v/k):'—';
    if($('rp-covers'))$('rp-covers').innerHTML=`<div class="card"><div class="card-title">お客さんの数（${n}日分）</div>${n?'':'<div class="hint">日計表で「お客さんの数」を入れると出ます</div>'}
      <div class="kv"><span>合計</span><span>${lc+dc}組 ・ ${lg+dg}人</span></div>
      <div class="kv"><span>ランチ</span><span>${lc}組 ・ ${lg}人</span></div>
      <div class="kv"><span>　1組／1人あたり</span><span>${per(ls,lc)} ／ ${per(ls,lg)}</span></div>
      <div class="kv"><span>ディナー</span><span>${dc}組 ・ ${dg}人</span></div>
      <div class="kv"><span>　1組／1人あたり</span><span>${per(ds,dc)} ／ ${per(ds,dg)}</span></div>
      <div class="kv"><span>1日平均</span><span>${n?Math.round((lc+dc)/n):0}組 ・ ${n?Math.round((lg+dg)/n):0}人</span></div>
      ${lc+dc?`<div class="kv"><span>1組の平均人数</span><span>${((lg+dg)/(lc+dc)).toFixed(1)}人</span></div>`:''}</div>`;
  }catch(e){}
}
// --- 日ごと ---
function reportDay(){
  const {ex,sales,m}=RP.data;const n=daysInMonth(m);
  const labels=[],sv=[],ev=[];
  for(let d=1;d<=n;d++){const ds=m+'-'+pad(d);labels.push(String(d));sv.push(salesTotal(sales,r=>r.date===ds));ev.push(expenseTotal(ex,e=>e.date===ds))}
  const best=sv.indexOf(Math.max(...sv));
  $('rp-body').innerHTML=`<div class="card"><div class="card-title">${monthLabel(m)}の毎日</div>
    ${barChart(labels,[{name:'売上',color:'var(--sales)',values:sv},{name:'経費',color:'var(--expense)',values:ev}],{labelEvery:5,height:150,tipLabel:i=>dateLabel(m+'-'+pad(i+1))})}</div>
    <div class="card"><div class="kv"><span>いちばん売れた日</span><span>${sv[best]?dateLabel(m+'-'+pad(best+1))+' '+yen(sv[best]):'—'}</span></div>
    <div class="kv"><span>1日あたりの売上（入力した日）</span><span>${(()=>{const days=sv.filter(v=>v>0).length;return days?yen(sum(sv)/days):'—'})()}</span></div></div>`;
}
// --- 曜日 ---
async function reportWeek(){
  const ids=rpIds();const to=ymd(),from=addDays(to,-90);
  $('rp-body').innerHTML=skel('report');
  try{
    const [sales,ex]=await Promise.all([fetchSales(ids,from,to),fetchExpenses(ids,from,to,'total,date')]);
    const sAmt=Array(7).fill(0),days=Array(7).fill(0).map(()=>new Set()),eAmt=Array(7).fill(0);
    sales.reports.forEach(r=>{const w=parseYmd(r.date).getDay();sAmt[w]+=reportSales(r);days[w].add(r.date)});
    sales.ar.forEach(a=>{const w=parseYmd(a.date).getDay();sAmt[w]+=a.amount||0});
    ex.forEach(e=>{if(e.date)eAmt[parseYmd(e.date).getDay()]+=e.total||0});
    const avg=sAmt.map((v,i)=>days[i].size?v/days[i].size:0);
    const order=[1,2,3,4,5,6,0];
    $('rp-body').innerHTML=`<div class="card"><div class="card-title">曜日ごとの平均売上</div><div class="hint" style="margin:-6px 0 10px">直近90日・売上を入力した日の平均</div>
      ${barChart(order.map(i=>WD[i]),[{name:'平均売上',color:'var(--sales)',values:order.map(i=>avg[i])}],{tipLabel:k=>WD[order[k]]+'曜日'})}</div>
      <div class="card"><div class="card-title">曜日ごとの経費（90日の合計）</div>${hbars(order.map(i=>[WD[i]+'曜日',eAmt[i]]),'var(--expense)')}</div>`;
  }catch(e){$('rp-body').innerHTML=`<div class="alert alert-d">集計できませんでした：${esc(e.message)}</div>`}
}
// --- 後払い ---
async function reportAr(){
  const ids=rpIds();const m=RP.month;
  try{
    const all=await db.getAll('daily_ar_entries?select=*'+inStores(ids)+`&date=gte.${monthStart(addMonths(m,-5))}&date=lte.${monthEnd(m)}&order=date.desc,id`);
    const by={};all.forEach(a=>{const k=a.client_name||'名前なし';by[k]=by[k]||{m:0,t:0,last:a.date};by[k].t+=a.amount||0;if((a.date||'').startsWith(m))by[k].m+=a.amount||0});
    const rows=Object.entries(by).sort((a,b)=>b[1].m-a[1].m||b[1].t-a[1].t);
    $('rp-body').innerHTML=`<div class="card"><div class="card-title">後払いのお客さん（${monthLabel(m)}）</div>${rows.length?rows.map(([n,v])=>`<div class="row"><div class="row-main"><div class="row-title">${esc(n)}</div><div class="row-sub">6か月の合計 ${yen(v.t)} ・ 最後 ${esc(v.last||'—')}</div></div><div class="row-right"><div class="amount">${yen(v.m)}</div><div class="hint">この月</div></div></div>`).join(''):'<div class="empty">後払いの記録はありません</div>'}</div>`;
  }catch(e){$('rp-body').innerHTML=`<div class="alert alert-d">集計できませんでした：${esc(e.message)}</div>`}
}
// --- 目標（固定費と黒字ライン） ---
async function reportGoal(){
  const one=rpSingle();const {sales,m}=RP.data;const sl=salesTotal(sales);
  let fixed=0,row={};
  try{
    const ids=rpIds();const rows=await db.get('fixed_costs?select=*'+inStores(ids));
    fixed=sum(rows,r=>(r.rent||0)+(r.labor||0)+(r.utilities||0)+(r.other||0));
    if(one)row=rows.find(r=>r.store_id===one.id)||{};
  }catch(e){}
  let h='';
  if(one){
    const f=(id,l,v)=>`<div class="field"><div class="label">${l}</div><div class="yen-wrap"><span>¥</span><input class="input num" id="${id}" inputmode="numeric" value="${v||''}" oninput="goalCalc()"/></div></div>`;
    h+=`<div class="card"><div class="card-title">毎月かならずかかるお金（固定費）</div>
      <div class="g2">${f('fc-rent','家賃・リース',row.rent)}${f('fc-labor','人件費',row.labor)}${f('fc-util','水道光熱費',row.utilities)}${f('fc-other','その他',row.other)}</div>
      <button class="btn btn-secondary" onclick="saveFixed('${one.id}')">固定費を保存する</button></div>`;
  }else{
    h+=`<div class="alert alert-i">固定費は、上のボタンで1つのお店をえらぶと入力できます。いまは${rpStores().length}店舗の合計で計算しています。</div>`;
  }
  h+='<div class="card" id="goal-result"></div>';
  $('rp-body').innerHTML=h;
  RP.goal={fixed,sales:sl,m};
  goalCalc();
}
function goalCalc(){
  let fixed=RP.goal.fixed;
  if($('fc-rent'))fixed=int($('fc-rent').value)+int($('fc-labor').value)+int($('fc-util').value)+int($('fc-other').value);
  const {sales,m}=RP.goal;const el=$('goal-result');if(!el)return;
  if(!fixed){el.innerHTML='<div class="hint">固定費を入れると「黒字になる売上」がわかります</div>';return}
  const pct=Math.round(sales/fixed*100);const color=pct>=100?'var(--green)':pct>=70?'var(--amber)':'var(--red)';
  el.innerHTML=`<div class="card-title">黒字になるための売上</div>
    <div class="kv"><span>1か月に必要な売上</span><span>${yen(fixed)}</span></div>
    <div class="kv"><span>1日に必要な売上</span><span>${yen(fixed/daysInMonth(m))}</span></div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;font-size:14px"><span>${monthLabel(m)}の達成</span><b style="color:${color}">${pct}%</b></div>
    <div class="progress"><div style="width:${Math.min(100,pct)}%;background:${color}"></div></div>
    <div class="hint" style="margin-top:6px">売上 ${yen(sales)} / 目標 ${yen(fixed)}${sales>=fixed?' ・ 黒字ラインをこえました！':' ・ あと '+yen(fixed-sales)}</div>`;
}
async function saveFixed(storeId){
  const p={store_id:storeId,rent:int($('fc-rent').value),labor:int($('fc-labor').value),utilities:int($('fc-util').value),other:int($('fc-other').value),updated_at:new Date().toISOString()};
  try{const ex=await db.get('fixed_costs?select=id&store_id=eq.'+storeId);
    if(ex.length)await db.patch('fixed_costs?id=eq.'+ex[0].id,p);else await db.post('fixed_costs',p);
    RP.goal.fixed=p.rent+p.labor+p.utilities+p.other;toast('保存しました','ok');
  }catch(e){toast('保存できませんでした：'+e.message,'err')}
}
// --- 来月の予想 ---
async function reportNext(){
  const ids=rpIds();const cur=ym();const months=[];for(let i=5;i>=0;i--)months.push(addMonths(cur,-i));
  $('rp-body').innerHTML=skel('report');
  try{
    const from=monthStart(months[0]),to=monthEnd(cur);
    const [sales,ex]=await Promise.all([fetchSales(ids,from,to),fetchExpenses(ids,from,to,'total,date')]);
    const st=months.map(m=>({m,s:salesTotal(sales,r=>(r.date||'').startsWith(m)),e:expenseTotal(ex,x=>(x.date||'').startsWith(m))}));
    const done=st.slice(0,5).filter(x=>x.s||x.e);
    const avgS=done.length?sum(done,x=>x.s)/done.length:0,avgE=done.length?sum(done,x=>x.e)/done.length:0;
    const r3=done.slice(-3),p3=done.slice(0,Math.max(0,done.length-3));
    const trend=p3.length&&sum(p3,x=>x.s)?((sum(r3,x=>x.s)/r3.length)/(sum(p3,x=>x.s)/p3.length)-1):0;
    const nextS=Math.round(avgS*(1+trend*0.5)),nextE=Math.round(avgE),nextP=nextS-nextE;
    const today=new Date().getDate(),dim=daysInMonth(cur);
    const curS=st[5].s,landS=today?Math.round(curS/today*dim):0;
    const tips=[];
    if(!done.length)tips.push('まだデータが少ないので、売上と経費を入力していくと予想できるようになります。');
    else{
      if(nextP<0)tips.push('🔴 来月は赤字になりそうです。大きな経費を見直してみましょう。');
      else if(nextP<avgE*0.1)tips.push('🟡 来月の利益は少なめの見込みです。');
      else tips.push('🟢 来月はプラスになりそうです。');
      if(trend<-0.1)tips.push('📉 最近は売上が下がりぎみです。');
      if(trend>0.15)tips.push('📈 最近は売上がのびています。');
      if(new Date().getMonth()===10)tips.push('🗓 12月はいちばん忙しい月です。仕入れと人手の準備を早めに。');
    }
    $('rp-body').innerHTML=`<div class="card" style="text-align:center"><div class="stat-label">来月の利益の予想</div>
      <div style="font-size:32px;font-weight:700;color:${nextP>=0?'var(--green)':'var(--red)'}" class="num">${yen(nextP)}</div>
      <div class="hint">売上 ${yen(nextS)} − 経費 ${yen(nextE)}（過去${done.length}か月の平均と流れから）</div></div>
      <div class="card"><div class="card-title">6か月の売上と経費</div>${barChart(st.map(x=>parseInt(x.m.slice(5))+'月'),[{name:'売上',color:'var(--sales)',values:st.map(x=>x.s)},{name:'経費',color:'var(--expense)',values:st.map(x=>x.e)}],{tipLabel:i=>monthLabel(st[i].m)+(i===5?'（途中）':'')})}</div>
      <div class="card"><div class="kv"><span>今月ここまでの売上（${today}/${dim}日）</span><span>${yen(curS)}</span></div><div class="kv"><span>このペースだと今月は</span><span>${yen(landS)}</span></div></div>
      <div class="card"><div class="card-title">ひとこと</div>${tips.map(t=>`<div style="padding:6px 0;font-size:14px">${esc(t)}</div>`).join('')}</div>`;
  }catch(e){$('rp-body').innerHTML=`<div class="alert alert-d">計算できませんでした：${esc(e.message)}</div>`}
}

<script>

function ledgerMissing(v){

  if(!v.vin)m.push('車台番号');

  if(!v.purchase_partner_address)m.push('仕入れ相手の住所');
  if(!v.purchase_partner_occupation)m.push('仕入れ相手の職業');
  if(!vIsBiz(v.purchase_partner_type)&&!v.purchase_partner_age)m.push('仕入れ相手の年齢');
  if(!v.purchase_id_method)m.push('本人確認の方法');
  if(v.status==='sold'){
    if(!v.sale_date)m.push('売った日');
    if(!v.buyer_name)m.push('売った相手の名前');
    if(!v.buyer_address)m.push('売った相手の住所');
  }
  return m;
}

const vProfit=v=>(v.sale_price||0)-(v.purchase_price||0)-vExp(v.id);
const vName=v=>((v.maker||'')+' '+(v.model||'')).trim()||'車名なし';
function renderVehicles(){

  ${incomplete.length?`<div class="alert alert-d" style="cursor:pointer" onclick="VH.filter='todo';renderVehicles()">古物台帳の記入が足りない車が <b>${incomplete.length}台</b> あります。タップして確認 ›</div>`:'<div class="alert alert-s" style="padding:8px 12px;font-size:13px">古物台帳は全部そろっています ✓</div>'}
  <div class="stat-row">
    <div class="stat"><div class="stat-label">在庫</div><div class="stat-value" style="color:var(--blue)">${stock.length}台</div><div class="stat-note">仕入れ合計 ${yenShort(sum(stock,v=>(v.purchase_price||0)+vExp(v.id)))}</div></div>

function showVehicle(id){

  const f=(k,l,type='text',ph='',req)=>`<div class="field"><div class="label">${l}${req?'<span style="color:var(--red)"> *</span>':''}</div><input class="input" id="vm-${k}" type="${type}" ${type==='number'?'inputmode="numeric"':''} placeholder="${ph}" value="${esc(v[k]??'')}"/></div>`;

}
async function saveVehicle(id,force){
  const g=k=>$('vm-'+k).value.trim();const pt=readPartner('vm');
  const p={maker:g('maker')||null,model:g('model')||null,model_code:g('model_code')||null,vin:g('vin')||null,plate_number:g('plate_number')||null,
    year:int(g('year'))||null,color:g('color')||null,mileage:int(g('mileage'))||null,vehicle_number:g('vehicle_number')||null,
    reconditioning:g('reconditioning')||null,memo:g('memo')||null,purchase_date:g('purchase_date')||null,purchase_price:normAmount(g('purchase_price')),
    purchase_partner_type:pt.type,purchase_source:pt.name,purchase_partner_address:pt.addr,purchase_partner_occupation:pt.job,purchase_partner_age:pt.age,
    purchase_id_method:pt.idm,purchase_id_number:pt.idn,updated_at:new Date().toISOString()};
  if(!p.maker&&!p.model){toast('メーカーか車名を入れてください','err');return}
  const old=id?VH.rows.find(x=>x.id===id):{status:'in_stock'};
  const miss=ledgerMissing({...old,...p}).filter(x=>!x.startsWith('売'));
  if(miss.length&&!force){
    $('vm-miss').innerHTML=`<div class="alert alert-w">古物台帳に必要な項目が空いています：<b>${miss.map(esc).join('・')}</b><br>あとで入れることもできますが、そのあいだ台帳は「未完成」になります。
      <button class="btn btn-secondary" style="margin-top:8px" onclick="saveVehicle('${id||''}',true)">わかった、あとで入れる（このまま保存）</button></div>`;
    $('vm-miss').scrollIntoView({behavior:'smooth',block:'center'});return;
  }
  p.store_id=$('vm-store')?.value||old.store_id||vehicleStores()[0].id;
  if(!id&&!p.vehicle_number)p.vehicle_number=await nextLedgerNumber(p.purchase_date);
  try{
    if(id)await db.patch('vehicles?id=eq.'+id,p);else await db.post('vehicles',{...p,status:'in_stock'});
    closeSheet();toast('保存しました','ok');PAGES.vehicles();
  }catch(e){toast('保存できませんでした：'+e.message,'err')}
}
// 管理番号を自動でつける（例: 2026-003）
async function nextLedgerNumber(date){
  const y=(date||ymd()).slice(0,4);
  try{const r=await db.get(`vehicles?select=vehicle_number&vehicle_number=like.${y}-*`+inStores(vehicleStores().map(s=>s.id)));
    const n=Math.max(0,...r.map(x=>parseInt(String(x.vehicle_number).split('-')[1])||0));return y+'-'+String(n+1).padStart(3,'0');
  }catch(e){return null}
}
async function cancelVehicle(id){
  const v=VH.rows.find(x=>x.id===id);
  const reason=prompt(`「${vName(v)}」を取り消します。\n古物台帳のきまりで、記録は3年間のこしておきます（一覧からは消えます）。\n\n取り消す理由を入れてください（例: まちがえて登録した）`);
  if(reason===null)return;
  try{await db.patch('vehicles?id=eq.'+id,{deleted_at:new Date().toISOString(),deleted_reason:reason||'取り消し',updated_at:new Date().toISOString()});closeSheet();toast('取り消しました');PAGES.vehicles()}
  catch(e){toast('取り消せませんでした','err')}
}
function sellVehicle(id){
  const v=VH.rows.find(x=>x.id===id);const cost=(v.purchase_price||0)+vExp(id);
  const sold=v.status==='sold';
  openSheet(`<div class="sheet-title">${sold?'売却の内容をなおす':'売れた車を登録'}</div><div class="sheet-sub">${esc(vName(v))} ・ 原価 ${yen(cost)}　<span style="color:var(--red)">*</span> は台帳に必要</div>
    <div class="field"><div class="label">売った値段</div><div class="yen-wrap"><span>¥</span><input class="input big num" id="vs-price" inputmode="numeric" value="${v.sale_price??''}" oninput="$('vs-profit').textContent=yen(normAmount(this.value)-${cost})"/></div><div class="hint">もうけ：<b id="vs-profit">${v.sale_price?yen(v.sale_price-cost):'—'}</b>（売上には入りません。売上は日計表で入力してください）</div></div>

    ${partnerFields('vs',v,{type:'buyer_type',name:'buyer_name',addr:'buyer_address',job:'buyer_occupation',age:'buyer_age',idm:'buyer_id_method'},false)}

async function saveSale(id,force){
  const price=normAmount($('vs-price').value);const pt=readPartner('vs');

  const miss=[];if(!$('vs-date').value)miss.push('売った日');if(!pt.name)miss.push('相手の名前');if(!pt.addr)miss.push('相手の住所');

async function unsellVehicle(id){
  if(!confirm('この車を在庫にもどしますか？（売却の記録は消えます）'))return;
  try{await db.patch('vehicles?id=eq.'+id,{status:'in_stock',sale_price:null,sale_date:null,updated_at:new Date().toISOString()});closeSheet();toast('在庫にもどしました');PAGES.vehicles()}catch(e){toast('できませんでした','err')}

async function ledgerRows(from,to,withDeleted){
  const ids=vehicleStores().map(s=>s.id);
  const all=await db.getAll('vehicles?select=*'+inStores(ids)+'&order=purchase_date.asc,created_at.asc,id');
  return all.filter(v=>(withDeleted||!v.deleted_at)&&((v.purchase_date&&v.purchase_date>=from&&v.purchase_date<=to)||(v.sale_date&&v.sale_date>=from&&v.sale_date<=to)));
}
const LEDGER_HEAD=['番号','受入年月日','品目','数量','車名','型式','車台番号','登録番号','年式','色','走行距離(km)','仕入先 区分','仕入先 氏名・名称','仕入先 住所','仕入先 職業','仕入先 年齢','本人確認の方法','確認書類の番号等','仕入金額','払出年月日','売却先 区分','売却先 氏名・名称','売却先 住所','売却先 職業','売却先 年齢','売却先 確認方法','売却金額','台帳の不足','取り消し','店舗'];
function ledgerLine(v,i){
  return [v.vehicle_number||String(i+1).padStart(4,'0'),v.purchase_date,'自動車',1,vName(v),v.model_code,v.vin,v.plate_number,v.year,v.color,v.mileage,
    v.purchase_partner_type,v.purchase_source,v.purchase_partner_address,v.purchase_partner_occupation,v.purchase_partner_age,v.purchase_id_method,v.purchase_id_number,v.purchase_price,
    v.status==='sold'?v.sale_date:'',v.status==='sold'?v.buyer_type:'',v.status==='sold'?v.buyer_name:'',v.status==='sold'?v.buyer_address:'',v.status==='sold'?v.buyer_occupation:'',v.status==='sold'?v.buyer_age:'',v.status==='sold'?v.buyer_id_method:'',v.status==='sold'?v.sale_price:'',
    ledgerMissing(v).join('・'),v.deleted_at?('取り消し '+v.deleted_at.slice(0,10)+' '+(v.deleted_reason||'')):'',storeName(v.store_id)];
}
async function ledgerExport(kind){
  const from=$('lg-from').value,to=$('lg-to').value;if(!from||!to||from>to){toast('期間を正しく入れてください','err');return}
  let rows;try{rows=await ledgerRows(from,to,$('lg-del').checked)}catch(e){toast('読み込めませんでした','err');return}
  if(!rows.length){toast('この期間の車はありません');return}
  const miss=rows.filter(v=>!v.deleted_at&&ledgerMissing(v).length).length;
  if(kind==='csv'){
    let t=csvLine(LEDGER_HEAD);rows.forEach((v,i)=>t+=csvLine(ledgerLine(v,i)));
    downloadText(`古物台帳_${from}_${to}.csv`,t);
  }else{
    const cell=x=>esc(x??'');
    $('print-frame').innerHTML=`<div class="p-page"><div class="p-title">古物台帳（自動車）</div><div class="p-meta">${esc(vehicleStores().map(s=>s.name).join('・'))} ／ 期間 ${from} 〜 ${to} ／ 出力 ${ymd()}</div>
      <table class="p-table" style="font-size:7pt"><tr><th>番号</th><th>受入日</th><th>車名・型式・車台番号・登録番号</th><th>仕入先（区分・氏名・住所・職業・年齢・確認方法）</th><th class="r">仕入額</th><th>払出日</th><th>売却先（区分・氏名・住所・職業・年齢）</th><th class="r">売却額</th></tr>
      ${rows.map((v,i)=>{const L=ledgerLine(v,i);return `<tr style="${v.deleted_at?'text-decoration:line-through;color:#999':''}"><td>${cell(L[0])}</td><td>${cell(L[1])}</td><td>${cell([L[4],L[5],L[6],L[7]].filter(Boolean).join(' / '))}${L[27]?`<br><b style="color:#A32D2D">不足: ${cell(L[27])}</b>`:''}${L[28]?`<br>${cell(L[28])}`:''}</td><td>${cell([L[11],L[12],L[13],L[14],L[15]&&L[15]+'歳',L[16],L[17]].filter(Boolean).join(' / '))}</td><td class="r">${L[18]?yen(L[18]):''}</td><td>${cell(L[19])}</td><td>${cell([L[20],L[21],L[22],L[23],L[24]&&L[24]+'歳'].filter(Boolean).join(' / '))}</td><td class="r">${L[26]?yen(L[26]):''}</td></tr>`}).join('')}</table></div>`;
    setTimeout(()=>window.print(),300);
  }
  toast(`${rows.length}台分を出力しました${miss?`（うち${miss}台は記入が足りません）`:''}`,miss?'err':'ok');
}
</script>
<script>
// ===== CARDS（カード明細の取込：オーナー） =====
const CD={cardId:null,items:[],month:null,busy:false,error:null};
PAGES.cards=async function(){
  if(!isOwner()){go('home');return}
  await loadCards();
  if(!CD.cardId||!S.cards.some(c=>c.id===CD.cardId))CD.cardId=S.cards[0]?.id||null;
  renderCards();
};
function renderCards(){
  let h=pageHead('カード明細の取込','カードの利用明細を、写真かCSVでまとめて経費にします');
  h+=`<div class="card"><div class="card-title">どのカード？ <button class="link-btn" onclick="editCard()">＋ カードを登録</button></div>`+
    (S.cards.length?S.cards.map(c=>`<div class="ctx-opt ${c.id===CD.cardId?'sel':''}" onclick="CD.cardId='${c.id}';renderCards()"><div class="ctx-opt-ico" style="background:var(--surface2);font-family:monospace;font-size:12px;font-weight:700">${esc(c.card_last4)}</div><div class="ctx-opt-name">${esc(c.card_name||'カード')}<div class="ctx-opt-sub">${esc(storeName(c.store_id))} の経費になります</div></div></div>`).join(''):'<div class="hint">まだカードがありません。下4けたとお店を登録してください。</div>')+'</div>';
  if(CD.busy)h+='<div class="busy"><div class="spinner"></div><div class="busy-title">明細を読み取っています...</div></div>';
  else if(!CD.items.length){
    h+=`${CD.error?`<div class="alert alert-d">${esc(CD.error)}</div>`:''}<div class="upload-grid">
      <button class="upload main" onclick="cardPhoto()" ${apiKeyOk()?'':'disabled'}><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg><span>明細を撮る</span></button>
      <button class="upload" onclick="cardCsv()"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg><span>CSVをえらぶ</span></button>
    </div><div class="hint">CSVは「日付・お店・金額」が入っていれば、カード会社の形式は問いません。</div>`;
  }else{
    const total=sum(CD.items.filter(i=>i.on),i=>i.amount||0);
    h+=`<div class="field"><div class="label">何月の明細？</div><input class="input" type="month" id="cd-month" value="${esc(CD.month||ym())}"/></div>
      <div class="card" style="padding:4px 12px">`+CD.items.map((it,i)=>`<div class="row" style="${it.on?'':'opacity:.45'}">
        <input type="checkbox" ${it.on?'checked':''} onchange="CD.items[${i}].on=this.checked;renderCards()" style="width:20px;height:20px;accent-color:var(--blue);flex-shrink:0"/>
        <div class="row-main"><div class="row-title" style="font-size:14px">${esc(it.vendor_name||'不明')}</div><div class="row-sub">${esc(it.date||'日付なし')}</div>
          <select class="input" style="padding:6px 30px 6px 8px;font-size:13px;margin-top:4px" onchange="CD.items[${i}].category_id=this.value||null"><option value="">種類なし</option>${S.cats.map(c=>`<option value="${c.id}" ${c.id===it.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div class="amount" style="font-size:15px">${yen(it.amount)}</div></div>`).join('')+`</div>
      <div class="card" style="display:flex;justify-content:space-between;padding:12px 16px"><b>登録する合計</b><b class="num">${yen(total)}</b></div>
      <div class="btn-col"><button class="btn btn-green" id="cd-save" onclick="saveCardItems()" ${CD.cardId?'':'disabled'}>${CD.items.filter(i=>i.on).length}件を経費にする</button><button class="btn btn-secondary" onclick="CD.items=[];renderCards()">やめる</button></div>`;
  }
  $('page-cards').innerHTML=h;
}
async function cardPhoto(){
  const f=await pickFile('lib');if(!f)return;
  CD.busy=true;CD.error=null;renderCards();
  try{
    const img=await compressImage(f);
    const r=await askClaude('read',imgContent(img,`カードの利用明細です。JSONだけを返してください。
{"card_last4":null,"statement_month":"YYYY-MM","items":[{"date":"YYYY-MM-DD","vendor_name":"利用先","amount":1234}]}
- 金額は数字のみ。返金はマイナス。年会費・手数料も1行として含める
- 読めない行は入れない`),3000);
    await setCardItems(r);
  }catch(e){CD.error='読み取れませんでした：'+e.message}
  CD.busy=false;renderCards();
}
async function cardCsv(){
  const f=await pickFile('csv');if(!f)return;
  let text='';
  try{const buf=await f.arrayBuffer();text=new TextDecoder('utf-8').decode(buf);if(/�/.test(text))text=new TextDecoder('shift_jis').decode(buf)}catch(e){CD.error='ファイルを開けませんでした';renderCards();return}
  const items=[];let last4=null,month=null;
  text.split(/\r?\n/).forEach((line,i)=>{
    if(i<6&&!last4){const m=line.match(/\*{2,}\s*(\d{4})|(\d{4})\s*$/);if(m)last4=m[1]||m[2]}
    const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));if(cols.length<3)return;
    let date=null,amount=null,vendor=null;
    cols.forEach(c=>{
      if(!date){const d=normDate(c.replace(/\//g,'-'));if(d)date=d}
    });
    const nums=cols.filter(c=>/^-?[\d,]+$/.test(c.replace(/[¥\s]/g,''))&&c.replace(/[^\d]/g,'').length>0);
    if(nums.length)amount=normAmount(nums[0]);
    vendor=cols.find(c=>c&&!normDate(c.replace(/\//g,'-'))&&!/^-?[\d,¥\s]+$/.test(c)&&c.length>1)||null;
    if(date&&vendor&&amount){items.push({date,vendor_name:vendor,amount});if(!month)month=date.slice(0,7)}
  });
  if(!items.length){CD.error='明細の行が見つかりませんでした';renderCards();return}
  await setCardItems({card_last4:last4,statement_month:month,items});
  renderCards();
}
async function setCardItems(r){
  const items=(r.items||[]).map(x=>({date:normDate(x.date),vendor_name:(x.vendor_name||'').trim(),amount:normAmount(x.amount),on:true})).filter(x=>x.amount);
  if(!items.length)throw new Error('明細の行が見つかりませんでした');
  for(const it of items)it.category_id=await guessCategory(it.vendor_name);
  CD.items=items;CD.month=r.statement_month||(items[0].date||ymd()).slice(0,7);
  if(r.card_last4){const c=S.cards.find(c=>c.card_last4===String(r.card_last4).slice(-4));if(c){CD.cardId=c.id;toast('カード ****'+c.card_last4+' を自動でえらびました')}}
}
async function saveCardItems(){
  const card=S.cards.find(c=>c.id===CD.cardId);if(!card){toast('カードをえらんでください','err');return}
  const list=CD.items.filter(i=>i.on);const btn=$('cd-save');btn.disabled=true;btn.textContent='登録しています...';
  try{

const IV={storeId:null,rows:[],ex:[]};
PAGES.invoices=function(){
  const cs=ctxStores();
  if(!IV.storeId||!cs.some(s=>s.id===IV.storeId))IV.storeId=defaultEntryStoreId();
  loadInvoices();

function invSwitch(id){IV.storeId=id;loadInvoices()}
async function loadInvoices(){
  const st=storeById(IV.storeId);
  if(!st){$('page-invoices').innerHTML=pageHead('請求書のチェック','')+'<div class="alert alert-w">担当のお店がありません。</div>';return}
  $('page-invoices').innerHTML=pageHead('請求書のチェック','')+skel('list');
  try{
    IV.rows=await db.get(`invoices?select=*&store_id=eq.${IV.storeId}&order=invoice_date.desc,created_at.desc&limit=60`);
    const from=IV.rows.reduce((m,i)=>{const d=i.period_start||(i.invoice_date?addMonths(i.invoice_date.slice(0,7),-1)+'-01':null);return d&&(!m||d<m)?d:m},null);
    IV.ex=from?await fetchExpenses([IV.storeId],from,null,'id,vendor_name,total,date'):[];
  }catch(e){IV.rows=[];IV.ex=[]}
  if(S.page==='invoices')renderInvoices();
}
function matchInvoice(inv){
  const key=(inv.vendor_name||'').replace(/(株式会社|有限会社|合同会社|\(株\)|（株）|\s)/g,'').slice(0,4);
  const inPeriod=e=>inv.period_start&&inv.period_end?(e.date>=inv.period_start&&e.date<=inv.period_end):(inv.invoice_date&&(e.date||'').startsWith(inv.invoice_date.slice(0,7)));
  const m=IV.ex.filter(e=>e.date&&inPeriod(e)&&key&&(e.vendor_name||'').replace(/\s/g,'').includes(key));
  const t=sum(m,e=>e.total||0);
  if(!m.length)return {st:'missing',m,t};
  return {st:Math.abs(t-(inv.total_amount||0))<=Math.max(100,(inv.total_amount||0)*0.02)?'ok':'diff',m,t};
}
function renderInvoices(){
  const st=storeById(IV.storeId);
  let h=pageHead('請求書のチェック','請求書の金額と、登録した経費の合計が合っているかを確かめます')+storePills(IV.storeId,'invSwitch');
  h+=`<div class="btn-col" style="margin-bottom:14px">${apiKeyOk()?'<button class="btn btn-primary" onclick="invoiceScan()">📷 請求書を撮って登録</button>':''}<button class="btn btn-secondary" onclick="invoiceForm({})">✏️ 手で登録</button></div>`;
  const res=IV.rows.map(i=>({i,r:matchInvoice(i)}));
  const ng=res.filter(x=>x.r.st!=='ok').length;
  if(ng)h+=`<div class="alert alert-w">${ng}件の請求書で、経費の登録が足りないか金額がちがいます</div>`;
  h+=res.length?res.map(({i,r})=>{
    const badge=r.st==='ok'?'<span class="pill pill-a">✓ 合っています</span>':r.st==='diff'?'<span class="pill pill-p">金額がちがう</span>':'<span class="pill pill-c">経費が見つからない</span>';
    const over=i.due_date&&i.due_date<ymd();
    return `<div class="card" style="border-left:3px solid ${r.st==='ok'?'var(--green)':r.st==='diff'?'var(--amber)':'var(--red)'}">
      <div style="display:flex;justify-content:space-between;gap:8px"><div class="row-main"><div class="row-title">${esc(i.vendor_name)}</div><div class="row-sub">${esc(i.invoice_date||'日付なし')}${i.period_start?` ・ ${esc(i.period_start)}〜${esc(i.period_end||'')}`:''}</div></div><div class="row-right"><div class="amount">${yen(i.total_amount)}</div>${badge}</div></div>
      ${r.st!=='ok'?`<div class="hint" style="margin-top:6px">${r.st==='diff'?`登録した経費の合計 ${yen(r.t)}（差 ${yen(Math.abs((i.total_amount||0)-r.t))}）`:'この取引先の経費がこの期間に登録されていません。入れ忘れかも？'}</div>`:''}
      ${i.due_date?`<div class="hint" style="color:${over?'var(--red)':''}">支払い期限 ${esc(i.due_date)}${over?' ・ 期限をすぎています':''}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:10px">${i.image_url?`<a class="btn btn-secondary btn-small" data-sign="${esc(i.image_url)}" target="_blank" rel="noopener" style="text-decoration:none">写真</a>`:''}<button class="btn btn-secondary btn-small" onclick="deleteInvoice('${i.id}')">消す</button></div>
    </div>`;}).join(''):'<div class="empty">まだ請求書がありません</div>';
  $('page-invoices').innerHTML=h;
}
async function invoiceScan(){
  const f=await pickFile('lib');if(!f)return;
  openSheet('<div class="sheet-title">請求書を読み取り中...</div><div class="busy"><div class="spinner"></div><div class="busy-title">AIが読んでいます</div></div>');
  try{
    const img=await compressImage(f);
    const r=await askClaude('read',imgContent(img,`請求書です。JSONだけを返してください。
{"vendor_name":"請求元","invoice_number":null,"invoice_date":"YYYY-MM-DD","due_date":null,"period_start":null,"period_end":null,"total_amount":0,"memo":null}
- 金額は数字のみ。読めない項目は null`),800);
    invoiceForm({vendor_name:r.vendor_name,invoice_number:r.invoice_number,invoice_date:normDate(r.invoice_date),due_date:normDate(r.due_date),period_start:normDate(r.period_start),period_end:normDate(r.period_end),total_amount:normAmount(r.total_amount),memo:r.memo},img);
  }catch(e){openSheet(`<div class="sheet-title">読み取れませんでした</div><div class="alert alert-d">${esc(e.message)}</div><button class="btn btn-secondary" onclick="invoiceForm({})">手で登録する</button>`)}
}

    <div class="g2">${f('invoice_date','請求日','date')}${f('due_date','支払い期限','date')}${f('period_start','対象期間（はじめ）','date')}${f('period_end','対象期間（おわり）','date')}</div>
    ${f('invoice_number','請求書番号')}${f('memo','メモ')}
    <div class="btn-col"><button class="btn btn-primary" onclick="saveInvoice()">登録してチェック</button><button class="btn btn-secondary" onclick="closeSheet()">やめる</button></div>`);

async function saveInvoice(){
  const g=k=>$('iv-'+k).value.trim()||null;
  const p={store_id:IV.storeId,vendor_name:g('vendor_name'),total_amount:normAmount(g('total_amount')),invoice_date:g('invoice_date'),due_date:g('due_date'),period_start:g('period_start'),period_end:g('period_end'),invoice_number:g('invoice_number'),memo:g('memo'),status:'registered'};

    // 記録があるお店は消さない（帳簿や台帳が消えてしまうため）
    const q=t=>db.get(t+'?select=id&store_id=eq.'+id+'&limit=1').catch(()=>[]);
    const [ex,dr,ar,vh,iv]=await Promise.all([q('expenses'),q('daily_reports'),q('daily_ar_entries'),q('vehicles'),q('invoices')]);
    const kinds=[ex.length&&'経費',dr.length&&'売上',ar.length&&'後払い',vh.length&&'車両（古物台帳）',iv.length&&'請求書'].filter(Boolean);
    if(kinds.length){alert(`「${name}」には ${kinds.join('・')} の記録があるので消せません。\n\n使わなくなった場合は、名前を「（閉店）${name}」などに変えてください。`);return}
    const deps=S.depts.filter(d=>d.store_id===id).length;
    if(!confirm(`「${name}」を消しますか？${deps?`\n中の部門（${deps}つ）もいっしょに消えます。`:''}`))return;
    // このお店にぶらさがっている設定を先に消す
    for(const t of ['departments','store_cards','fixed_costs','accounts_receivable_clients','restaurant_covers','card_statement_batches'])
      await db.del(t+'?store_id=eq.'+id).catch(()=>{});
    // ユーザーの担当からも外す
    const us=await db.get('app_users?select=id,store_id,store_ids').catch(()=>[]);
    for(const u of us){
      const ids=(u.store_ids||[]).filter(x=>x!==id);
      if(ids.length!==(u.store_ids||[]).length||u.store_id===id)
        await db.patch('app_users?id=eq.'+u.id,{store_ids:ids,store_id:u.store_id===id?(ids[0]||null):u.store_id}).catch(()=>{});
    }
    if(S.user.store_ids?.includes(id))S.user.store_ids=S.user.store_ids.filter(x=>x!==id);
    await db.del('stores?id=eq.'+id);
    await reloadMasters();closeSheet();toast('消しました','ok');renderOrg();
  }catch(e){
    toast(/foreign key|violates/i.test(e.message)?'このお店にはまだ記録がつながっているので消せませんでした':'消せませんでした：'+e.message,'err');
  }
}

async function saveUser(id){
  const role=$('us-role').querySelector('.active')?.dataset.v||'staff';
  const storeIds=[...document.querySelectorAll('.us-st:checked')].map(x=>x.value);
  const p={username:$('us-name').value.trim(),role,store_ids:role==='owner'?[]:storeIds};
  const pass=$('us-pass').value.trim();if(pass)p.password=pass;
  if(!p.username){toast('名前を入れてください','err');return}
  if(!id&&!pass){toast('パスワードを入れてください','err');return}
  if(pass&&pass.length<6){toast('パスワードは6文字以上にしてください','err');return}
  if(role==='staff'&&!storeIds.length){toast('担当するお店を1つ以上えらんでください','err');return}
  if(S.users.some(u=>u.username===p.username&&u.id!==id)){toast('同じ名前のユーザーがいます','err');return}
  const r=await callFn('keihi-admin',Object.assign({action:id?'update':'create',id:id||undefined},p));
  if(!r.ok){toast('保存できませんでした：'+(r.data?.error||r.status),'err');return}
  if(id===S.user.id&&r.data.user){Object.assign(S.user,r.data.user);restoreCtx()}
  closeSheet();toast('保存しました','ok');renderUsers();
}
async function deleteUser(id){
  const u=S.users.find(x=>x.id===id);
  if(u.role==='owner'&&S.users.filter(x=>x.role==='owner').length<=1){toast('オーナーが1人もいなくなるので消せません','err');return}
  if(!confirm(`「${u.username}」を消しますか？`))return;
  const r=await callFn('keihi-admin',{action:'delete',id});
  if(!r.ok){toast('消せませんでした：'+(r.data?.error||r.status),'err');return}
  closeSheet();toast('消しました');renderUsers();
}

      let t=csvLine(['日付','事業','店舗','部門','取引先','金額','消費税8%','消費税10%','支払方法','経費の種類','会計コード','メモ','書類','状態','インボイス番号','カード','画像URL','登録者','登録日時']);
      const dl={receipt:'レシート・領収書',delivery_note:'納品書',invoice:'請求書',card_statement:'カード明細',manual:'手入力'};
      ex.forEach(e=>{const c=catById(e.category_id);t+=csvLine([e.date,bizOfStore(e.store_id)?.name,storeName(e.store_id),deptById(e.department_id)?.name,e.vendor_name,e.total,e.tax_8,e.tax_10,normPay(e.payment_method),c?.name,c?.code,e.memo,dl[e.doc_type]||e.doc_type,STATUS_LABEL[e.status]||e.status,e.invoice_number,e.card_last4&&'****'+e.card_last4,e.image_url,e.created_by,(e.created_at||'').slice(0,16).replace('T',' ')])});
      downloadText(`経費明細_${r.label}.csv`,t);
      const nd=await db.getAll('expenses?select=id'+inStores(ids)+'&date=is.null&order=id').catch(()=>[]);
      if(nd.length)xpStatus(`経費 ${ex.length}件をダウンロードしました。ただし日付が入っていない経費が ${nd.length}件 あり、CSVに入っていません。経費の一覧で月を「日付なし」にして日付を入れてください。`,'w');
      else xpStatus(`経費 ${ex.length}件をダウンロードしました`,'s');
    }else if(type==='daily'){
      const s=await fetchSales(ids,r.from,r.to);
      let t=csvLine(['日付','事業','店舗','現金売上','カード売上','アプリ売上','その他入金','後払い','売上合計','現金経費','カード経費','カード手数料','アプリ手数料','その他出金','支出合計','手元に残る','メモ']);
      s.reports.forEach(d=>{const st=storeById(d.store_id);const ar=sum(s.ar.filter(a=>a.date===d.date&&a.store_id===d.store_id),a=>a.amount||0);
        const cf=Math.round((d.card_sales||0)*(st?.card_fee_rate??3.24)/100),af=Math.round((d.app_sales||0)*(st?.app_fee_rate??1.98)/100);
        const inc=reportSales(d)+ar,out=(d.cash_expenses||0)+(d.card_expenses||0)+cf+af+(d.other_expenses||0);
        t+=csvLine([d.date,bizOfStore(d.store_id)?.name,storeName(d.store_id),d.cash_sales,d.card_sales,d.app_sales,d.other_income,ar,inc,d.cash_expenses,d.card_expenses,cf,af,d.other_expenses,out,inc-out,d.memo])});
      downloadText(`日計表_${r.label}.csv`,t);
      if(s.ar.length){let a=csvLine(['日付','店舗','後払い先','金額']);s.ar.forEach(x=>a+=csvLine([x.date,storeName(x.store_id),x.client_name,x.amount]));downloadText(`後払い明細_${r.label}.csv`,a)}
      xpStatus(`日計表 ${s.reports.length}日分をダウンロードしました`,'s');
    }else{
      const all=await db.getAll('vehicles?select=*'+inStores(ids)+'&order=purchase_date.asc,created_at.asc,id');
      const vs=all.filter(v=>!v.deleted_at&&((v.purchase_date&&v.purchase_date>=r.from&&v.purchase_date<=r.to)||(v.sale_date&&v.sale_date>=r.from&&v.sale_date<=r.to)));
      let t=csvLine(LEDGER_HEAD);vs.forEach((v,i)=>t+=csvLine(ledgerLine(v,i)));
      downloadText(`古物台帳_${r.label}.csv`,t);xpStatus(`車両 ${vs.length}台をダウンロードしました`,'s');
    }
  }catch(e){xpStatus('作れませんでした：'+e.message,'d')}
}
async function printMonthly(){
  const r=exportRange();if(!r)return;const m=r.tm;const ids=exportScope();const pm=addMonths(m,-1);
  xpStatus('レポートを作っています...');
  try{
    const [ex,sales,pex,psales]=await Promise.all([fetchExpenses(ids,monthStart(m),monthEnd(m)),fetchSales(ids,monthStart(m),monthEnd(m)),fetchExpenses(ids,monthStart(pm),monthEnd(pm),'total'),fetchSales(ids,monthStart(pm),monthEnd(pm))]);
    const sl=salesTotal(sales),xp=expenseTotal(ex),psl=salesTotal(psales),pxp=expenseTotal(pex);
    const stores=ids.map(storeById).filter(Boolean);
    const byCat={};ex.forEach(e=>{const k=catById(e.category_id)?.name||'種類なし';byCat[k]=(byCat[k]||0)+(e.total||0)});
    const days=[];for(let d=1;d<=daysInMonth(m);d++){const ds=m+'-'+pad(d);const a=salesTotal(sales,x=>x.date===ds),b=expenseTotal(ex,x=>x.date===ds);if(a||b)days.push([ds,a,b])}
    const pct=(a,b)=>b?((a-b)/Math.abs(b)*100>=0?'+':'')+Math.round((a-b)/Math.abs(b)*100)+'%':'—';
    $('print-frame').innerHTML=`<div class="p-page">
      <div class="p-title">月次レポート ${monthLabel(m)}</div>
      <div class="p-meta">${stores.map(s=>esc(s.name)).join('・')} ／ 作成 ${ymd()}</div>
      <div class="p-sec"><div class="p-sec-title">まとめ</div><div class="p-kpis">
        <div class="p-kpi"><div class="p-kpi-l">売上</div><div class="p-kpi-v">${yen(sl)}</div><div class="p-kpi-l">前月比 ${pct(sl,psl)}</div></div>
        <div class="p-kpi"><div class="p-kpi-l">経費</div><div class="p-kpi-v">${yen(xp)}</div><div class="p-kpi-l">前月比 ${pct(xp,pxp)}</div></div>
        <div class="p-kpi"><div class="p-kpi-l">利益</div><div class="p-kpi-v" style="color:${sl-xp>=0?'#0F6E56':'#A32D2D'}">${yen(sl-xp)}</div><div class="p-kpi-l">前月 ${yen(psl-pxp)}</div></div></div></div>
      ${stores.length>1?`<div class="p-sec"><div class="p-sec-title">お店ごと</div><table class="p-table"><tr><th>事業</th><th>お店</th><th class="r">売上</th><th class="r">経費</th><th class="r">利益</th></tr>${stores.map(s=>{const f=x=>x.store_id===s.id;const a=salesTotal(sales,f),b=expenseTotal(ex,f);return `<tr><td>${esc(bizOfStore(s.id)?.name||'')}</td><td>${esc(s.name)}</td><td class="r">${yen(a)}</td><td class="r">${yen(b)}</td><td class="r">${yen(a-b)}</td></tr>`}).join('')}</table></div>`:''}
      <div class="p-sec"><div class="p-sec-title">経費の種類ごと</div><table class="p-table"><tr><th>種類</th><th class="r">金額</th><th class="r">割合</th></tr>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${yen(v)}</td><td class="r">${xp?Math.round(v/xp*100):0}%</td></tr>`).join('')}</table></div>
      <div class="p-sec p-break"><div class="p-sec-title">日ごと</div><table class="p-table"><tr><th>日付</th><th class="r">売上</th><th class="r">経費</th><th class="r">差</th></tr>${days.map(([d,a,b])=>`<tr><td>${dateLabel(d)}</td><td class="r">${yen(a)}</td><td class="r">${yen(b)}</td><td class="r">${yen(a-b)}</td></tr>`).join('')}</table></div>
    </div>`;
    xpStatus('印刷の画面を開きます（「PDFに保存」もえらべます）','s');
    setTimeout(()=>window.print(),300);
  }catch(e){xpStatus('作れませんでした：'+e.message,'d')}
}
async function sendGas(){
  const url=$('gas-url').value.trim();if(!/^https:\/\/script\.google\.com\//.test(url)){toast('スプレッドシート連携のURLを入れてください','err');return}
  LS.set('gas_url',url);
  const r=exportRange();if(!r)return;const ids=exportScope();
  const months=[];for(let m=r.fm;m<=r.tm;m=addMonths(m,1))months.push(m);
  const send=async p=>{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)});const j=await res.json();if(!j.success)throw new Error(j.error||'送れませんでした')};
  try{
    for(const sid of ids){
      const st=storeById(sid);xpStatus(st.name+' を送っています...');
      for(const m of months){
        const ex=await fetchExpenses([sid],monthStart(m),monthEnd(m));
        if(ex.length)await send({type:'expenses',month:m,store_name:st.name,store_color:st.color,data:ex.reverse().map(e=>({...e,category_name:catById(e.category_id)?.name||'',dept_name:deptById(e.department_id)?.name||'',status_label:STATUS_LABEL[e.status]||'',is_approved:e.status==='approved'}))});
        const s=await fetchSales([sid],monthStart(m),monthEnd(m));
        if(s.reports.length)await send({type:'daily',month:m,store_name:st.name,store_color:st.color,data:{daily:s.reports.map(d=>{const ar=sum(s.ar.filter(a=>a.date===d.date),a=>a.amount||0);const fee=feeOf(d);const inc=reportSales(d)+ar,out=(d.cash_expenses||0)+(d.card_expenses||0)+(d.other_expenses||0)+fee;return {...d,ar_total:ar,total_income:inc,total_expense:out,balance:inc-out}}),ar:s.ar}});
      }
      if(bizOfStore(sid)?.track_vehicles){const vs=await db.getAll('vehicles?select=*&store_id=eq.'+sid+'&order=id');if(vs.length)await send({type:'vehicles',store_name:st.name,store_color:st.color,data:vs})}
    }
    xpStatus('スプレッドシートに送りました','s');
  }catch(e){xpStatus('送れませんでした：'+e.message,'d')}
}

    <div class="field"><div class="label">データベースキー</div><input class="input mono" id="ad-key" type="password" value="${esc(SB_KEY)}"/></div>
    <div class="field"><div class="label">読み取りに使うAIモデル（左から順に試します）</div><input class="input mono" id="ad-mread" value="${esc(MODELS.read.join(','))}"/></div>
    <div class="field"><div class="label">速いAIモデル</div><input class="input mono" id="ad-mfast" value="${esc(MODELS.fast.join(','))}"/></div>
    <div class="btn-col"><button class="btn btn-secondary" onclick="testDb()">接続を確かめる</button><button class="btn btn-primary" onclick="saveAdvanced()">保存して読み込みなおす</button><button class="btn btn-secondary" onclick="resetAdvanced()">はじめの設定にもどす</button></div>
    <div id="ad-status" style="margin-top:12px"></div>`;
}
async function testDb(){
  const u=$('ad-url').value.trim(),k=$('ad-key').value.trim();
  try{const r=await fetch(u+'/rest/v1/stores?select=id&limit=1',{headers:{apikey:k,Authorization:'Bearer '+k}});
    $('ad-status').innerHTML=r.ok?'<div class="alert alert-s">つながりました</div>':`<div class="alert alert-d">つながりません（${r.status}）</div>`}
  catch(e){$('ad-status').innerHTML=`<div class="alert alert-d">つながりません：${esc(e.message)}</div>`}
}
function saveAdvanced(){
  LS.set('sb_url',$('ad-url').value.trim());LS.set('sb_key',$('ad-key').value.trim());
  LS.set('model_read',$('ad-mread').value.trim());LS.set('model_fast',$('ad-mfast').value.trim());
  location.reload();
}
function resetAdvanced(){['sb_url','sb_key','model_read','model_fast'].forEach(k=>LS.del(k));location.reload()}

motionInit();
resumeSession();
