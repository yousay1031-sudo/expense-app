<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23185FA5'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="経費AI">
<meta name="theme-color" content="#EEF3F9">
<title>経費AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F4F0;--surface:#FFF;--surface2:#F2F1ED;--surface3:#E9E7E1;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#1A1A18;--text2:#6B6B67;--text3:#9B9B97;
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-d:#0C447C;
  --green:#0F6E56;--green-l:#E1F5EE;
  --amber:#BA7517;--amber-l:#FAEEDA;
  --red:#A32D2D;--red-l:#FCEBEB;
  --purple:#534AB7;--purple-l:#EEEDFE;
  --sales:#185FA5;--expense:#BA7517;
  --nav:68px;--header:56px;--r:12px;--r-lg:16px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input[type=file]{display:none}
.hidden{display:none!important}

/* ===== LOGIN ===== */
.login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;z-index:1000}
.login-logo{font-size:34px;font-weight:700;letter-spacing:-1px;margin-bottom:6px}
.login-logo span,.logo span{color:var(--blue)}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:28px;text-align:center}
.login-card{background:var(--surface);border-radius:var(--r-lg);padding:22px;width:100%;max-width:380px;border:0.5px solid var(--border2)}

/* ===== SHELL ===== */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{height:var(--header);background:var(--surface);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:50}
.logo{font-size:16px;font-weight:700;letter-spacing:-.5px;flex-shrink:0}
.ctx-chip{display:flex;align-items:center;gap:6px;min-width:0;flex:1;padding:7px 12px;border-radius:22px;border:0.5px solid var(--border2);background:var(--surface2);cursor:pointer;font-size:14px;font-weight:700;text-align:left}
.ctx-chip .ctx-ico{font-size:16px;flex-shrink:0}
.ctx-chip .ctx-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ctx-chip .ctx-caret{color:var(--text2);font-size:11px;flex-shrink:0}
.ctx-chip.static{cursor:default}
.ctx-chip.static .ctx-caret{display:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0.5px solid var(--border2);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--nav) + 24px)}
.scroll>.page{max-width:640px;margin:0 auto}
.bottom-nav{height:var(--nav);background:var(--surface);border-top:0.5px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--text3);position:relative}
.bn.active{color:var(--blue)}
.bn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-label{font-size:11px;font-weight:700}
.bn-cam-circle{background:var(--blue);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(24,95,165,.35);margin-top:-14px}
.bn-cam-circle svg{stroke:#fff;width:26px;height:26px}
.bn-badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ===== COMMON ===== */
.page{display:none}.page.active{display:block}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.back-btn{width:34px;height:34px;border-radius:50%;border:0.5px solid var(--border2);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:var(--text2)}
.page-title{font-size:21px;font-weight:700;flex:1;min-width:0}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:16px}
.section-label{font-size:13px;font-weight:700;color:var(--text2);margin:18px 0 8px}
.card{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.link-btn{font-size:13px;color:var(--blue);cursor:pointer;font-weight:700;border:none;background:none;white-space:nowrap}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r);padding:13px 14px}
.stat.tap{cursor:pointer}
.stat-label{font-size:12px;color:var(--text2);font-weight:500}
.stat-value{font-size:21px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.stat-note{font-size:11px;color:var(--text3);margin-top:2px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.pill-p{background:var(--amber-l);color:var(--amber)}
.pill-a{background:var(--green-l);color:var(--green)}
.pill-c{background:var(--red-l);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--text2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font-size:13px;font-weight:700;color:var(--text2)}
.hint{font-size:12px;color:var(--text3)}
.input{border:0.5px solid var(--border2);border-radius:10px;padding:12px 14px;font-size:16px;background:var(--surface);color:var(--text);width:100%;-webkit-appearance:none;appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,#9B9B97 50%),linear-gradient(135deg,#9B9B97 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.input.mono{font-family:monospace;font-size:13px}
.input.big{font-size:22px;font-weight:700}
.input.ai{background:var(--blue-l);border-color:rgba(24,95,165,.25)}
textarea.input{resize:none;min-height:72px}
.yen-wrap{display:flex;align-items:center;gap:6px}
.yen-wrap>span{font-weight:700;color:var(--text2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.cv-meal{font-size:14px;font-weight:700;margin:4px 0 6px}
.cv-unit{margin-top:4px}
.btn{padding:14px;border-radius:var(--r);font-size:16px;font-weight:700;border:none;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-secondary{background:var(--surface);color:var(--text);border:0.5px solid var(--border2)}
.btn-danger{background:var(--red-l);color:var(--red);border:0.5px solid rgba(163,45,45,.2)}
.btn-small{padding:8px 14px;font-size:13px;width:auto;border-radius:20px}
.btn:active{opacity:.85}
.btn-col{display:flex;flex-direction:column;gap:10px}
.alert{border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:12px;line-height:1.6}
.alert-s{background:var(--green-l);color:var(--green)}
.alert-d{background:var(--red-l);color:var(--red)}
.alert-w{background:var(--amber-l);color:#8a560f}
.alert-i{background:var(--blue-l);color:var(--blue-d)}
.empty{text-align:center;padding:28px 12px;color:var(--text3);font-size:14px}
.spinner{width:20px;height:20px;border:2.5px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--border)}
.row:last-child{border-bottom:none}
.row.tap{cursor:pointer}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.row-right{text-align:right;flex-shrink:0}
.amount{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin-bottom:12px}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 15px;border-radius:20px;font-size:13px;font-weight:700;border:0.5px solid var(--border2);background:var(--surface);cursor:pointer;color:var(--text2);white-space:nowrap;flex-shrink:0}
.seg button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tabs{display:flex;border-bottom:0.5px solid var(--border2);margin-bottom:14px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 14px;font-size:14px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--text2);border-bottom:2.5px solid transparent;white-space:nowrap;flex-shrink:0}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:0.5px solid var(--border2);border-radius:var(--r);margin-bottom:10px;cursor:pointer;background:var(--surface)}
.toggle input{width:22px;height:22px;accent-color:var(--blue);flex-shrink:0}
.toggle-text{flex:1}
.toggle-title{font-size:14px;font-weight:700}
.toggle-sub{font-size:12px;color:var(--text2)}

/* ===== SHEET (bottom modal) ===== */
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-size:18px;font-weight:700;margin-bottom:2px}
.sheet-sub{font-size:13px;color:var(--text2);margin-bottom:14px}
.toast{position:fixed;bottom:calc(var(--nav) + 18px);left:50%;transform:translateX(-50%) translateY(10px);background:#1A1A18;color:#fff;font-size:15px;font-weight:700;padding:13px 24px;border-radius:24px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.unit-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.unit-btn{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:14px;border:1.5px solid var(--border2);background:var(--surface);font-size:16px;font-weight:700;cursor:pointer;text-align:left;min-height:58px;color:var(--text2)}
.unit-btn .ub-ico{font-size:24px;line-height:1;flex-shrink:0}
.unit-btn .ub-name{flex:1;min-width:0;line-height:1.3}
.unit-btn small{display:block;font-size:11px;font-weight:700;color:var(--text3)}
.unit-btn.sel{border:2.5px solid var(--uc);color:var(--text);background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.unit-btn.sel .ub-name::before{content:'✓ ';color:var(--uc)}
.unit-btns.sm{margin:6px 0 0;gap:6px}
.unit-btns.sm .unit-btn{min-height:44px;padding:8px 10px;font-size:14px;border-radius:12px}
.unit-btns.sm .ub-ico{font-size:18px}
.guess-note{font-size:12px;color:var(--text3);margin:-8px 0 12px}
.guess-note.warn{color:var(--amber);font-weight:700}
.dept-seg button{padding:11px 20px;font-size:15px}
.dept-need .label{color:var(--amber)}
.dept-need .dept-seg button{border-color:var(--amber)}
/* ===== CONTEXT PICKER ===== */
.ctx-opt{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:var(--r);cursor:pointer;border:0.5px solid transparent;margin-bottom:4px}
.ctx-opt:active{background:var(--surface2)}
.ctx-opt.sel{background:var(--blue-l);border-color:rgba(24,95,165,.3)}
.ctx-opt.child{margin-left:26px}
.ctx-opt-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.ctx-opt-name{font-size:15px;font-weight:700;flex:1;min-width:0}
.ctx-opt-sub{font-size:12px;color:var(--text2);font-weight:400}

/* ===== HOME ===== */
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:0.5px solid var(--border)}
.todo:last-child{border-bottom:none}
.todo.tap{cursor:pointer}
.todo-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.todo-check.done{background:var(--green);border-color:var(--green)}
.todo-check.urgent{border-color:var(--red)}
.todo-text{flex:1;font-size:15px;font-weight:500}
.todo-text.done{color:var(--text3);text-decoration:line-through}
.todo-text.urgent{color:var(--red);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 10px;border-radius:var(--r-lg);border:0.5px solid var(--border2);background:var(--surface);cursor:pointer;position:relative;min-height:96px}
.tile:active{background:var(--surface2)}
.tile-ico{font-size:28px;line-height:1}
.tile-label{font-size:14px;font-weight:700;text-align:center}
.tile-badge{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;padding:0 6px;display:flex;align-items:center;justify-content:center}
.unit-card{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--border);cursor:pointer}
.unit-card:last-child{border-bottom:none}
.unit-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}

/* ===== SCAN ===== */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:26px 12px;border-radius:var(--r-lg);border:2px dashed var(--border2);background:var(--surface);cursor:pointer}
.upload svg{width:30px;height:30px;stroke:var(--text2);fill:none;stroke-width:1.5}
.upload span{font-size:14px;font-weight:700;color:var(--text2)}
.upload.main{border-color:var(--blue);background:var(--blue-l)}
.upload.main svg{stroke:var(--blue)}
.upload.main span{color:var(--blue)}
.preview{width:100%;max-height:260px;object-fit:contain;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--surface2);display:block;margin-bottom:12px}
.busy{display:flex;align-items:center;gap:12px;padding:14px;background:var(--blue-l);border-radius:var(--r);margin-bottom:12px}
.busy-title{font-size:15px;font-weight:700;color:var(--blue)}
.busy-sub{font-size:12px;color:var(--text2)}
.doc-card{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r-lg);padding:14px;margin-bottom:12px}
.doc-card.skip{opacity:.45}
.doc-card.low{border-color:var(--amber);border-width:1.5px}
.doc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.doc-head input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue);flex-shrink:0}
.doc-thumb{width:100%;max-height:170px;object-fit:contain;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface2);margin-bottom:10px;display:block}
.conf{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.conf-h{background:var(--green-l);color:var(--green)}
.conf-m{background:var(--amber-l);color:#8a560f}
.conf-l{background:var(--red-l);color:var(--red)}

/* ===== ENTRY ===== */
.entry-row{border:0.5px solid var(--border2);border-radius:var(--r);padding:10px;margin-bottom:8px;background:var(--surface)}
.entry-line{display:flex;gap:6px;margin-bottom:6px}
.entry-line .input{padding:10px 11px;font-size:15px}
.entry-del{width:40px;flex-shrink:0;border-radius:10px;border:0.5px solid rgba(163,45,45,.2);background:var(--red-l);color:var(--red);cursor:pointer;font-size:18px}

/* ===== DAILY ===== */
.d-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.d-row:last-child{border-bottom:none}
.d-label{font-size:15px;font-weight:500;flex:1;min-width:0}
.d-label small{display:block;font-size:11px;color:var(--text3);font-weight:400}
.d-input{border:0.5px solid var(--border2);border-radius:10px;padding:10px 12px;font-size:18px;font-weight:700;background:var(--surface);width:150px;text-align:right;font-variant-numeric:tabular-nums}
.d-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.d-auto{font-size:18px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.d-total{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:var(--r);margin-top:10px}
.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.date-nav button{width:42px;height:42px;border-radius:50%;border:0.5px solid var(--border2);background:var(--surface);font-size:20px;cursor:pointer;flex-shrink:0}
.date-nav input{flex:1;text-align:center;font-weight:700}
.ar-row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ar-row .input{padding:9px 10px;font-size:14px}
.store-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.store-pills::-webkit-scrollbar{display:none}
.store-pills button{padding:8px 15px;border-radius:20px;font-size:13px;font-weight:700;border:0.5px solid var(--border2);background:var(--surface);cursor:pointer;color:var(--text2);white-space:nowrap;flex-shrink:0}

/* ===== CHARTS ===== */
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--border2);position:relative}
.bar-col{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%;cursor:pointer;min-width:0;gap:2px}
.bar{width:100%;max-width:26px;border-radius:4px 4px 0 0;min-height:0}
.bar-labels{display:flex;gap:2px;margin-top:4px}
.bar-labels div{flex:1;text-align:center;font-size:10px;color:var(--text3);min-width:0;white-space:nowrap;overflow:visible}
.chart-readout{font-size:13px;color:var(--text2);min-height:22px;margin-bottom:6px}
.chart-readout b{color:var(--text)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hbar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.hbar-row:last-child{border-bottom:none}
.hbar-label{width:84px;font-size:13px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-bg{flex:1;height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.hbar{height:100%;border-radius:0 4px 4px 0}
.hbar-val{width:88px;text-align:right;font-size:13px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--text2)}
.kv span:last-child{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.progress{height:14px;background:var(--surface2);border-radius:7px;overflow:hidden;margin-top:6px}
.progress div{height:100%;border-radius:7px}

/* ===== SETTINGS TREE ===== */
.set-group{margin-bottom:10px}
.set-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r);cursor:pointer;margin-bottom:8px}
.set-item:active{background:var(--surface2)}
.set-item-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--surface2)}
.set-item-main{flex:1;min-width:0}
.set-item-title{font-size:15px;font-weight:700}
.set-item-sub{font-size:12px;color:var(--text2)}
.chev{color:var(--text3);font-size:18px;flex-shrink:0}
.biz-block{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.biz-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;border-bottom:0.5px solid var(--border)}
.biz-head:active{background:var(--surface2)}
.store-node{padding:10px 14px 12px 22px;border-bottom:0.5px solid var(--border)}
.store-node:last-of-type{border-bottom:none}
.store-line{display:flex;align-items:center;gap:10px;cursor:pointer}
.dept-line{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 44px}
.dept-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;border:0.5px solid var(--border2);background:var(--surface)}
.add-tag{display:inline-flex;align-items:center;padding:5px 11px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;border:1px dashed var(--border2);color:var(--text2);background:none}
.add-line{display:block;width:100%;text-align:left;padding:12px 14px 12px 22px;font-size:14px;font-weight:700;color:var(--blue);background:var(--surface2);border:none;cursor:pointer}
.edit-mini{font-size:12px;font-weight:700;color:var(--text2);border:0.5px solid var(--border2);border-radius:14px;padding:4px 10px;background:var(--surface);cursor:pointer;flex-shrink:0}
.check-list label{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:0.5px solid var(--border);font-size:15px;cursor:pointer}
.check-list input{width:20px;height:20px;accent-color:var(--blue)}
.check-group-title{font-size:12px;font-weight:700;color:var(--text3);margin:10px 0 2px}
.color-input{height:46px;width:100%;border:0.5px solid var(--border2);border-radius:10px;padding:4px 8px;background:var(--surface)}

/* =====================================================================
   LIQUID GLASS THEME（白ベース）
   ここより上の色・形を上書きします。文字は濃いまま（読みやすさ優先）
   ===================================================================== */
:root{
  --bg:#EEF3F9;
  --surface:rgba(255,255,255,.72);--surface2:rgba(240,245,251,.75);--surface3:rgba(226,234,244,.85);
  --solid:#FFFFFF;
  --border:rgba(30,60,110,.07);--border2:rgba(30,60,110,.12);
  --text:#14181F;--text2:#5B6472;--text3:#8C95A3;
  --blue:#1E6BD0;--blue-l:rgba(30,107,208,.10);--blue-d:#0E4A99;
  --green:#0E8A66;--green-l:rgba(14,138,102,.11);
  --amber:#B8731A;--amber-l:rgba(232,160,40,.15);
  --red:#C23B3B;--red-l:rgba(220,60,60,.10);
  --purple:#5B4FCF;--purple-l:rgba(91,79,207,.10);
  --r:16px;--r-lg:22px;
  --glass:linear-gradient(155deg,rgba(255,255,255,.86) 0%,rgba(255,255,255,.62) 55%,rgba(255,255,255,.70) 100%);
  --glass-strong:linear-gradient(155deg,rgba(255,255,255,.95),rgba(255,255,255,.82));
  --glass-blur:blur(22px) saturate(185%);
  --glass-edge:1px solid rgba(255,255,255,.85);
  --glass-shadow:0 10px 30px -8px rgba(28,58,110,.16),0 2px 6px rgba(28,58,110,.06),0 0 0 .5px rgba(28,58,110,.08);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -8px 16px -12px rgba(30,107,208,.10);
  --ease:cubic-bezier(.22,.9,.24,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
body{background:var(--bg);-webkit-font-smoothing:antialiased}
/* 背景：ゆっくり動くやわらかい光 */
body::before,body::after{content:'';position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(60px);opacity:.75}
body::before{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(120,180,255,.55),rgba(120,180,255,0) 65%);animation:lgDrift1 26s ease-in-out infinite alternate}
body::after{width:65vmax;height:65vmax;right:-28vmax;bottom:-25vmax;background:radial-gradient(circle,rgba(150,225,210,.5),rgba(190,170,255,.25) 45%,rgba(255,255,255,0) 70%);animation:lgDrift2 32s ease-in-out infinite alternate}
@keyframes lgDrift1{to{transform:translate(18vmax,14vmax) scale(1.12)}}
@keyframes lgDrift2{to{transform:translate(-16vmax,-12vmax) scale(1.08)}}
.app,.login{position:relative;z-index:1;background:transparent}
.login{position:fixed}

/* ガラスの面 */
.card,.stat,.tile,.set-item,.biz-block,.doc-card,.login-card,.toggle,.unit-btn,.entry-row,.upload,
.header,.bottom-nav,.sheet,.icon-btn,.back-btn,.btn-secondary,.ctx-chip,.date-nav button,.busy,.skel-card{
  background:var(--glass);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:var(--glass-edge);
  box-shadow:var(--glass-shadow),var(--glass-hi);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.stat,.tile,.set-item,.biz-block,.doc-card,.login-card,.toggle,.unit-btn,.entry-row,.upload,
  .header,.bottom-nav,.sheet,.icon-btn,.back-btn,.btn-secondary,.ctx-chip,.date-nav button,.busy,.skel-card{background:rgba(255,255,255,.96)}
}
.card,.doc-card,.biz-block{border-radius:var(--r-lg)}
.card{padding:18px}
.card-accent{position:relative;overflow:hidden}
.card-accent::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,#4C9BFF,#1E6BD0 60%,#5B4FCF)}
.stat{border-radius:var(--r);padding:14px 16px}
.stat-value{letter-spacing:-.3px}
.row,.todo,.d-row,.kv,.hbar-row,.unit-card{border-bottom-color:rgba(30,60,110,.07)}

/* ヘッダーと下のメニュー：画面の上に浮かぶガラス */
.app{position:relative}
.header{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;height:54px;border-radius:20px;padding:0 8px 0 14px}
.logo{font-size:17px;letter-spacing:-.6px}
.logo span,.login-logo span{background:linear-gradient(135deg,#3A8DFF,#1E6BD0 55%,#5B4FCF);-webkit-background-clip:text;background-clip:text;color:transparent}
.ctx-chip{border-radius:16px;box-shadow:var(--glass-hi);background:rgba(255,255,255,.55)}
.scroll{padding:calc(var(--header) + 24px + env(safe-area-inset-top)) 16px calc(var(--nav) + 44px + env(safe-area-inset-bottom));scroll-padding-top:calc(var(--header) + 24px + env(safe-area-inset-top));scroll-padding-bottom:calc(var(--nav) + 40px + env(safe-area-inset-bottom))}
.bottom-nav{position:absolute;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));height:66px;border-radius:26px;padding:0 6px}
.bn{border-radius:20px;margin:7px 2px;transition:color .25s var(--ease)}
.bn::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(155deg,rgba(30,107,208,.14),rgba(30,107,208,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.9);opacity:0;transform:scale(.7);transition:opacity .3s var(--ease),transform .45s var(--spring)}
.bn.active::before{opacity:1;transform:scale(1)}
.bn#bn-scan::before{display:none}
.bn svg{transition:transform .45s var(--spring)}
.bn.active svg{transform:translateY(-1px) scale(1.08)}
.bn-cam-circle{width:58px;height:58px;margin-top:-26px;background:linear-gradient(150deg,#4C9BFF 0%,#1E6BD0 55%,#3D4FD6 100%);box-shadow:0 10px 24px -6px rgba(30,107,208,.6),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -6px 12px rgba(10,40,120,.25);border:2px solid rgba(255,255,255,.9);position:relative;transition:transform .4s var(--spring)}
.bn-cam-circle::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(30,107,208,.35);animation:lgPulse 2.8s ease-out infinite}
@keyframes lgPulse{0%{transform:scale(.85);opacity:.9}70%,100%{transform:scale(1.25);opacity:0}}
.bn:active .bn-cam-circle{transform:scale(.9)}

/* ボタン：押すと少し沈む・光る */
.btn{border-radius:var(--r);position:relative;overflow:hidden;transition:transform .35s var(--spring),box-shadow .3s var(--ease),filter .2s;isolation:isolate}
.btn:active{opacity:1;transform:scale(.97)}
.btn-primary{background:linear-gradient(150deg,#3D8EF5 0%,#1E6BD0 60%,#1A57B8 100%);box-shadow:0 10px 22px -8px rgba(30,107,208,.65),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-green{background:linear-gradient(150deg,#22B288 0%,#0E8A66 60%,#0B7556 100%);box-shadow:0 10px 22px -8px rgba(14,138,102,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-danger{background:rgba(220,60,60,.09);border:1px solid rgba(220,60,60,.22);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.btn-primary::before,.btn-green::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:lgSheen 5.5s ease-in-out infinite;z-index:-1}
@keyframes lgSheen{0%,70%{left:-60%}100%{left:130%}}
.btn:disabled{opacity:.45;filter:saturate(.4)}
.btn:disabled::before{display:none}
.btn-small{border-radius:14px}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);transform:scale(0);animation:lgRipple .6s var(--ease) forwards;z-index:0}
.btn-secondary .ripple,.tile .ripple,.set-item .ripple,.unit-btn .ripple,.stat .ripple{background:radial-gradient(circle,rgba(30,107,208,.18),rgba(30,107,208,0) 70%)}
@keyframes lgRipple{to{transform:scale(1);opacity:0}}

/* さわれる面：押したときの沈み */
.tile,.set-item,.stat.tap,.unit-btn,.icon-btn,.back-btn,.ctx-chip,.upload,.biz-head,.row.tap,.todo.tap,.unit-card,.seg button,.store-pills button,.date-nav button,.dept-tag,.edit-mini,.link-btn{transition:transform .35s var(--spring),box-shadow .3s var(--ease),background .25s,border-color .25s,color .25s;position:relative;overflow:hidden}
.tile:active,.set-item:active,.stat.tap:active,.unit-btn:active,.upload:active,.unit-card:active{transform:scale(.97);background:var(--glass)}
.icon-btn:active,.back-btn:active,.date-nav button:active{transform:scale(.9)}
.row.tap:active,.todo.tap:active{transform:scale(.99)}
.seg button:active,.store-pills button:active,.dept-tag:active{transform:scale(.94)}
.tile{min-height:104px;border-radius:var(--r-lg)}
.tile-ico{font-size:30px;filter:drop-shadow(0 4px 6px rgba(28,58,110,.15));transition:transform .45s var(--spring)}
.tile:active .tile-ico{transform:scale(1.15) rotate(-6deg)}
.tile-badge,.bn-badge{box-shadow:0 4px 10px -2px rgba(194,59,59,.5);animation:lgPop .5s var(--spring) both}
.set-item{border-radius:var(--r)}
.set-item-ico,.unit-ico,.ctx-opt-ico{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 6px rgba(28,58,110,.08)}
.set-item-ico{background:rgba(255,255,255,.7)}

/* 入力欄 */
.input,.d-input,.color-input{background:rgba(255,255,255,.78);border:1px solid rgba(30,60,110,.12);border-radius:14px;box-shadow:inset 0 1px 2px rgba(28,58,110,.06);transition:border-color .2s,box-shadow .25s var(--ease),background .2s}
.input:focus,.d-input:focus{background:#fff;border-color:rgba(30,107,208,.55);box-shadow:0 0 0 4px rgba(30,107,208,.14),inset 0 1px 2px rgba(28,58,110,.04)}
.input.ai{background:linear-gradient(155deg,rgba(225,238,255,.9),rgba(240,247,255,.8));border-color:rgba(30,107,208,.25)}

/* 切り替えボタン（セグメント） */
.seg,.store-pills,.sk-pills{padding:6px 6px 10px;margin:-6px -6px 6px}
.seg button,.store-pills button{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(28,58,110,.06),0 0 0 .5px rgba(28,58,110,.1);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.seg button.active{background:linear-gradient(150deg,#3D8EF5,#1E6BD0);color:#fff;border-color:transparent;box-shadow:0 6px 14px -4px rgba(30,107,208,.55),inset 0 1px 0 rgba(255,255,255,.4);animation:lgPop .45s var(--spring)}
.tabs{border-bottom-color:rgba(30,60,110,.1)}
.tabs button{transition:color .25s}
.tabs button.active{border-bottom-width:3px}

/* お店ボタン */
.unit-btn{border-radius:18px;border-width:1px}
.unit-btn.sel{border:2px solid var(--uc);background:var(--glass-strong);box-shadow:0 8px 20px -6px color-mix(in srgb,var(--uc) 45%,transparent),var(--glass-hi);animation:lgPop .45s var(--spring)}

/* 小さな部品 */
.pill,.chip,.conf{box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.chip{background:rgba(255,255,255,.7);box-shadow:0 0 0 .5px rgba(28,58,110,.1)}
.alert{border-radius:var(--r);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:0 4px 14px -6px rgba(28,58,110,.12)}
.alert-i{background:linear-gradient(155deg,rgba(225,238,255,.9),rgba(235,243,255,.7))}
.alert-s{background:linear-gradient(155deg,rgba(220,246,236,.9),rgba(232,249,242,.7))}
.alert-w{background:linear-gradient(155deg,rgba(255,240,214,.92),rgba(255,246,228,.75))}
.alert-d{background:linear-gradient(155deg,rgba(255,226,226,.92),rgba(255,238,238,.75))}
.todo-check{transition:background .3s,border-color .3s,transform .45s var(--spring)}
.todo-check.done{background:linear-gradient(150deg,#22B288,#0E8A66);box-shadow:0 4px 10px -3px rgba(14,138,102,.55)}
.upload{border:1.5px dashed rgba(30,107,208,.28)}
.upload.main{background:linear-gradient(155deg,rgba(225,238,255,.92),rgba(240,247,255,.7));border-color:rgba(30,107,208,.45)}
.upload.main svg{animation:lgFloat 3.2s ease-in-out infinite}
@keyframes lgFloat{50%{transform:translateY(-4px)}}
.preview,.doc-thumb{border-radius:18px;border:1px solid rgba(255,255,255,.9);box-shadow:var(--glass-shadow)}
.bar{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));transform-origin:bottom}
.hbar{transform-origin:left}
.progress,.hbar-bg{background:rgba(30,60,110,.07);box-shadow:inset 0 1px 2px rgba(28,58,110,.08)}

/* ボトムシート：ばねのように上がる */
.sheet-bg{background:rgba(20,30,50,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-bg.open{animation:lgFade .3s var(--ease)}
.sheet-bg.open .sheet{animation:lgSheetUp .55s var(--spring)}
.sheet-bg.closing{animation:lgFadeOut .22s var(--ease) forwards;pointer-events:none}
.sheet-bg.closing .sheet{animation:lgSheetDown .25s var(--ease) forwards}
.sheet{border-radius:28px 28px 0 0;background:var(--glass-strong);border-bottom:none}
.sheet-handle{width:44px;height:5px;background:rgba(30,60,110,.18)}
@keyframes lgSheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes lgSheetDown{to{transform:translateY(100%)}}
@keyframes lgFade{from{opacity:0}}
@keyframes lgFadeOut{to{opacity:0}}

/* お知らせ（トースト）：ガラスのカプセル */
.toast{background:rgba(20,26,36,.82)!important;-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.18);border-radius:22px;transform:translateX(-50%) translateY(20px) scale(.9);transition:opacity .3s var(--ease),transform .5s var(--spring);bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
.toast.show{transform:translateX(-50%) translateY(0) scale(1)}
.toast.ok{box-shadow:0 10px 30px -8px rgba(14,138,102,.6),inset 0 0 0 1px rgba(34,178,136,.45)}
.toast.err{box-shadow:0 10px 30px -8px rgba(194,59,59,.6),inset 0 0 0 1px rgba(230,90,90,.5)}

/* AIが読んでいる途中 */
.busy{border-radius:var(--r);position:relative;overflow:hidden;background:linear-gradient(155deg,rgba(225,238,255,.92),rgba(240,247,255,.75))}
.busy::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);background-size:250% 100%;animation:lgShimmer 1.8s linear infinite}
.spinner{border-color:rgba(30,107,208,.9);border-top-color:transparent}
.scan-wrap{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px}
.scan-wrap .preview{margin:0}
.scan-beam{position:absolute;left:0;right:0;height:28%;top:-28%;background:linear-gradient(180deg,rgba(76,155,255,0),rgba(76,155,255,.35) 70%,rgba(140,200,255,.9));border-bottom:2px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(76,155,255,.6);animation:lgScan 1.9s var(--ease) infinite}
@keyframes lgScan{0%{top:-28%}100%{top:100%}}

/* ===== スケルトン（読み込み中の形） ===== */
.skel{animation:lgFade .3s var(--ease)}
.skel-card{border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.sk{position:relative;overflow:hidden;border-radius:10px;background:rgba(30,60,110,.08)}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:lgSk 1.4s ease-in-out infinite}
@keyframes lgSk{to{transform:translateX(100%)}}
@keyframes lgShimmer{from{background-position:150% 0}to{background-position:-100% 0}}
.sk-line{height:12px;margin:8px 0}
.sk-title{height:18px;width:45%;margin:4px 0 12px}
.sk-big{height:28px;width:70%;margin-top:8px}
.sk-circle{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.sk-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid rgba(30,60,110,.06)}
.sk-row:last-child{border-bottom:none}
.sk-row .sk-main{flex:1}
.sk-pill{height:34px;width:84px;border-radius:17px;flex-shrink:0}
.sk-tile{height:104px;border-radius:var(--r-lg)}
.sk-chart{height:140px;border-radius:14px;margin-top:8px}
.sk-input{height:44px;width:150px;border-radius:14px}
.sk-pills{display:flex;gap:8px;margin-bottom:14px;overflow:hidden}

/* ===== 出てくるときのアニメーション ===== */
.page.active{animation:lgPage .5s var(--ease)}
@keyframes lgPage{from{opacity:0;transform:translateY(10px)}}
.lg-in{animation:lgIn .6s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes lgIn{from{opacity:0;transform:translateY(14px) scale(.98);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.lg-grow{animation:lgGrowY .8s var(--ease) both;animation-delay:calc(var(--i,0) * 25ms + 150ms)}
.lg-grow-x{animation:lgGrowX .8s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms + 150ms)}
@keyframes lgGrowY{from{transform:scaleY(0)}}
@keyframes lgGrowX{from{transform:scaleX(0)}}
@keyframes lgPop{0%{transform:scale(.92)}100%{transform:scale(1)}}
.login-card{border-radius:28px;padding:26px 22px;animation:lgIn .8s var(--ease) .1s both}
.login-logo{font-size:40px;animation:lgIn .8s var(--ease) both}
.login-sub{animation:lgIn .8s var(--ease) .05s both}
.empty{animation:lgIn .6s var(--ease) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== PRINT REPORT ===== */

<script>
'use strict';

// =====================================================================

// ===== CONFIG =====
const DEFAULT_URL='https://nwkigrnqqctuhlvkakxx.supabase.co';
const DEFAULT_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53a2lncm5xcWN0dWhsdmtha3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTAxMzksImV4cCI6MjA4OTcyNjEzOX0.GHzFoBJ0ZxVJgBET4qWlIzfJmS_jQVFfyOhBxUQZZHw';
const LS={
  get(k,d=null){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},

};
let SB_URL=LS.get('sb_url')||DEFAULT_URL;

// 前の版で端末に残していたAIキーは消す（キーはサーバー側だけに置く）
LS.del('api_key');LS.del('session_user');
// AIモデル（新しい順に試し、使えないものは自動で次へ）
const MODELS={
  read:(LS.get('model_read')||'claude-sonnet-5-5,claude-sonnet-4-5,claude-sonnet-4-20250514').split(',').map(s=>s.trim()).filter(Boolean),

};

// ===== STATE =====
const S={
  user:null,            // ログイン中のユーザー
  aiReady:false,        // AIのキーがサーバーに設定されているか
  businesses:[], stores:[], depts:[], cats:[],

// ===== SMALL HELPERS =====
const $=id=>document.getElementById(id);
function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function yen(n){n=Math.round(n||0);return (n<0?'−¥':'¥')+Math.abs(n).toLocaleString()}
function yenShort(n){n=Math.round(n||0);const a=Math.abs(n);const s=a>=100000000?(a/100000000).toFixed(1)+'億':a>=10000?(Math.round(a/1000)/10)+'万':a.toLocaleString();return (n<0?'−':'')+'¥'+s}
function int(v){const n=parseInt(String(v??'').replace(/[^0-9\-]/g,''),10);return isNaN(n)?0:n}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ym(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function parseYmd(s){const[a,b,c]=String(s).split('-').map(Number);return new Date(a,(b||1)-1,c||1)}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function monthStart(m){return m+'-01'}
function monthEnd(m){const[y,mm]=m.split('-').map(Number);return m+'-'+pad(new Date(y,mm,0).getDate())}
function daysInMonth(m){const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()}
function addMonths(m,n){const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return ym(d)}
function monthLabel(m){const[y,mm]=m.split('-');return y+'年'+parseInt(mm)+'月'}
function dateLabel(s){if(!s)return '日付なし';const d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）'}
function uid(){return Math.random().toString(36).slice(2,10)}
function sum(arr,f){return arr.reduce((s,x)=>s+(f?f(x):x||0),0)}
const WD='日月火水木金土';

function toast(msg,type){
  const t=$('toast');t.textContent=msg;
  t.classList.remove('ok','err');if(type==='ok'||type==='err')t.classList.add(type);
  t.classList.remove('show');void t.offsetWidth;
  t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),2400);
}
function openSheet(html){
  const bg=$('sheet-bg');clearTimeout(bg._tm);bg.classList.remove('closing');
  $('sheet').innerHTML='<div class="sheet-handle"></div>'+html;
  const was=bg.classList.contains('open');bg.classList.add('open');$('sheet').scrollTop=0;
  if(!was)motionKick($('sheet'));
}
function closeSheet(){
  const bg=$('sheet-bg');if(!bg.classList.contains('open'))return;
  if(motionOff()){bg.classList.remove('open');return}
  bg.classList.add('closing');clearTimeout(bg._tm);
  bg._tm=setTimeout(()=>{bg.classList.remove('open','closing')},230);
}

// ===== うごき（アニメーション） =====
// 画面を開いたとき・読み込みが終わったときだけ、中身を順番にふわっと出す。
// ボタンを押して描き直しただけのときは動かさない（落ち着いて操作できるように）。
const MOTION={until:0,root:null};
function motionOff(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches}
function motionKick(root){MOTION.until=performance.now()+900;MOTION.root=root||null}
const MOTION_SEL='.card,.stat,.tile,.set-item,.biz-block,.doc-card,.unit-card,.todo,.row,.d-row,.kv,.alert,.unit-btn,.entry-row,.hbar-row,.toggle,.seg,.upload-grid,.store-pills,.ctx-opt,.tabs';
function motionApply(nodes){
  if(motionOff())return;
  const counter=new Map();
  nodes.forEach(el=>{
    if(el.closest('.skel'))return;
    const list=el.matches(MOTION_SEL)?[el]:[];
    el.querySelectorAll&&el.querySelectorAll(MOTION_SEL).forEach(x=>list.push(x));
    list.forEach(x=>{
      if(x.parentElement&&x.parentElement.closest('.lg-in'))return; // 親が動くなら子は動かさない
      const n=Math.min(counter.get(x.parentElement)||0,10);counter.set(x.parentElement,n+1);
      x.style.setProperty('--i',n);x.classList.remove('lg-in');void x.offsetWidth;x.classList.add('lg-in');
      x.addEventListener('animationend',()=>x.classList.remove('lg-in'),{once:true});
    });
    el.querySelectorAll&&el.querySelectorAll('.bar').forEach((b,i)=>{b.style.setProperty('--i',Math.min(i,40));b.classList.add('lg-grow')});
    el.querySelectorAll&&el.querySelectorAll('.hbar,.progress>div').forEach((b,i)=>{b.style.setProperty('--i',Math.min(i,12));b.classList.add('lg-grow-x')});
    countUp(el);
  });
}
// 金額や件数を 0 から数え上げる
function countUp(root){
  const els=root.querySelectorAll?root.querySelectorAll('.stat-value,.d-total .amount,.d-total b,.kpi-value'):[];
  els.forEach(el=>{
    if(el.children.length)return;
    const m=el.textContent.match(/^(\D*?)(-?[\d,]+)(\D*)$/);if(!m)return;
    const target=parseInt(m[2].replace(/,/g,''),10);if(!isFinite(target)||Math.abs(target)<10)return;
    const fmt=v=>m[1]+(m[2].includes(',')?Math.round(v).toLocaleString('ja-JP'):String(Math.round(v)))+m[3];
    const t0=performance.now(),dur=700;
    const step=now=>{const k=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-k,3);el.textContent=fmt(target*e);if(k<1)requestAnimationFrame(step);else el.textContent=m[1]+m[2]+m[3]};
    el.textContent=fmt(0);requestAnimationFrame(step);
  });
}
function motionInit(){
  const obs=new MutationObserver(muts=>{
    let replacedSkel=false;const added=[];
    muts.forEach(m=>{
      m.removedNodes.forEach(n=>{if(n.nodeType===1&&(n.classList.contains('skel')||n.querySelector&&n.querySelector('.skel')))replacedSkel=true});
      m.addedNodes.forEach(n=>{if(n.nodeType===1)added.push(n)});
    });
    if(!added.length)return;
    added.forEach(n=>{if(n.querySelector&&(n.hasAttribute('data-sign')||n.querySelector('[data-sign]')))hydrateImages(n.parentNode||n)});
    if(replacedSkel||performance.now()<MOTION.until){
      // 同じ描き直しで重複しないよう、いちばん外側だけ
      const top=added.filter(n=>!added.some(o=>o!==n&&o.contains(n)));
      motionApply(top);
    }
  });
  ['scroll','sheet'].forEach(id=>obs.observe($(id),{childList:true,subtree:true}));
  // 押したところから光が広がる
  document.addEventListener('pointerdown',e=>{
    if(motionOff())return;
    const t=e.target.closest('.btn,.tile,.set-item,.unit-btn,.stat.tap,.upload');if(!t||t.disabled)return;
    const r=t.getBoundingClientRect(),size=Math.max(r.width,r.height)*2;
    const sp=document.createElement('span');sp.className='ripple';
    sp.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
    t.appendChild(sp);setTimeout(()=>sp.remove(),650);
  },{passive:true});
}

// ===== スケルトン（読み込み中に、画面の形を先に出す） =====
function skel(kind){
  const L=(w,h)=>`<div class="sk sk-line" style="width:${w}%${h?';height:'+h+'px':''}"></div>`;
  const row=()=>`<div class="sk-row"><div class="sk sk-circle"></div><div class="sk-main">${L(55+Math.round(Math.random()*30))}${L(30+Math.round(Math.random()*25),10)}</div><div class="sk" style="width:64px;height:18px"></div></div>`;
  const rows=n=>Array.from({length:n},row).join('');
  const stat=()=>`<div class="skel-card" style="margin:0;border-radius:var(--r)">${L(50,10)}<div class="sk sk-big"></div></div>`;
  const pills=n=>`<div class="sk-pills">${Array.from({length:n},()=>'<div class="sk sk-pill"></div>').join('')}</div>`;
  let h='';
  if(kind==='home'){
    h=`<div class="stat-row">${stat()}${stat()}</div><div class="skel-card"><div class="sk sk-title"></div>${rows(3)}</div>
      <div class="tiles">${Array.from({length:4},()=>'<div class="sk sk-tile"></div>').join('')}</div>`;
  }else if(kind==='list'){
    h=pills(4)+`<div class="skel-card">${rows(7)}</div>`;
  }else if(kind==='report'){
    h=pills(3)+`<div class="stat-row">${stat()}${stat()}</div><div class="stat-row">${stat()}${stat()}</div>
      <div class="skel-card"><div class="sk sk-title"></div><div class="sk sk-chart"></div></div><div class="skel-card">${rows(4)}</div>`;
  }else if(kind==='form'){
    const fr=()=>`<div class="sk-row"><div class="sk-main">${L(45)}</div><div class="sk sk-input"></div></div>`;
    h=`<div class="skel-card"><div class="sk sk-title"></div>${Array.from({length:5},fr).join('')}</div><div class="skel-card"><div class="sk sk-title"></div>${Array.from({length:3},fr).join('')}</div>`;
  }else if(kind==='settings'){
    h=Array.from({length:5},()=>`<div class="skel-card" style="display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r)"><div class="sk" style="width:36px;height:36px;border-radius:10px;flex-shrink:0"></div><div style="flex:1">${L(50)}${L(70,10)}</div></div>`).join('');
  }else{
    h=`<div class="skel-card">${rows(5)}</div>`;
  }
  return `<div class="skel" aria-busy="true" aria-label="読み込んでいます">${h}</div>`;
}

// ===== ログイン（Supabase Auth） =====
// パスワードは Supabase Auth に暗号化して保存。アプリの表にはパスワードを置かない。
// ログイン用のメールは「ユーザーID@keihi.local」（画面には出さない）
const AUTH={access:null,refresh:null,exp:0,uid:null,_refreshing:null};
function authLoad(){try{const j=JSON.parse(LS.get('sb_session')||'null');if(j&&j.refresh){Object.assign(AUTH,{access:j.access,refresh:j.refresh,exp:j.exp||0,uid:j.uid})}}catch(e){}}
function authSave(){LS.set('sb_session',JSON.stringify({access:AUTH.access,refresh:AUTH.refresh,exp:AUTH.exp,uid:AUTH.uid}))}
function authClear(){AUTH.access=AUTH.refresh=AUTH.uid=null;AUTH.exp=0;LS.del('sb_session')}
function authSet(j){AUTH.access=j.access_token;AUTH.refresh=j.refresh_token;AUTH.exp=Date.now()+(j.expires_in||3600)*1000;AUTH.uid=j.user?.id||AUTH.uid;authSave()}
async function authCall(grant,body){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('ログインできませんでした '+r.status));
  return j;
}
async function authLogin(userId,password){authSet(await authCall('password',{email:userId+'@keihi.local',password}))}
async function authRefresh(){
  if(!AUTH.refresh)throw new Error('ログインしてください');
  if(!AUTH._refreshing)AUTH._refreshing=authCall('refresh_token',{refresh_token:AUTH.refresh}).then(j=>{authSet(j)}).finally(()=>{AUTH._refreshing=null});
  return AUTH._refreshing;
}
async function authToken(){
  if(!AUTH.access)return null;
  if(Date.now()>AUTH.exp-60000){try{await authRefresh()}catch(e){authExpired();throw e}}
  return AUTH.access;
}
function authExpired(){
  // 長いあいだ使わずにログインが切れたとき
  if(!S.user)return;
  authClear();S.user=null;resetUserState();
  $('app').classList.add('hidden');$('login').classList.remove('hidden');$('login-pass').value='';
  loadLoginUsers();
  const err=$('login-err');err.textContent='しばらく使わなかったので、もう一度ログインしてください';err.classList.remove('hidden');
}
async function authLogout(){
  const t=AUTH.access;authClear();
  if(t)fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+t}}).catch(()=>{});
}

// ===== SUPABASE =====
async function sbHeaders(extra){const t=await authToken();return Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+(t||SB_KEY),'Content-Type':'application/json','Prefer':'return=representation'},extra||{})}
async function sbReq(method,path,body,extra,retried){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method,headers:await sbHeaders(extra),body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401&&AUTH.refresh&&!retried){try{await authRefresh()}catch(e){authExpired();throw new Error('ログインしてください')}return sbReq(method,path,body,extra,true)}
  if(!r.ok){let t=await r.text();try{t=JSON.parse(t).message||t}catch(e){}throw new Error(t)}
  if(r.status===204)return null;
  const txt=await r.text();return txt?JSON.parse(txt):null;
}

// 写真の保存場所はログインした人しか見られないので、見るときに1時間だけ使えるURLをもらう
const _signed={};
function imgPathOf(urlOrPath){
  if(!urlOrPath)return null;const s=String(urlOrPath);
  const m=s.match(/\/storage\/v1\/object\/(?:public|sign|authenticated)\/receipts\/([^?]+)/);if(m)return decodeURIComponent(m[1]);
  return s.replace(/^receipts\//,'');
}
async function signedImgUrl(urlOrPath){
  const p=imgPathOf(urlOrPath);if(!p)return null;
  const c=_signed[p];if(c&&c.until>Date.now())return c.url;
  try{
    const t=await authToken();
    const r=await fetch(SB_URL+'/storage/v1/object/sign/receipts/'+p.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+(t||SB_KEY),'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
    if(!r.ok)return null;const j=await r.json();
    const url=SB_URL+'/storage/v1'+(j.signedURL||j.signedUrl);
    _signed[p]={url,until:Date.now()+50*60000};return url;
  }catch(e){return null}
}
// data-sign="..." の付いた画像・リンクに、見られるURLを入れる

  });
}

const _storeGuess={};
async function guessStore(vendor,texts,aiIdx){
  const mine=myStores();if(mine.length<=1)return {id:mine[0]?.id||null,why:''};
  if(vendor){
    if(_storeGuess[vendor]===undefined){
      try{const r=await db.get('expenses?select=store_id&vendor_name=eq.'+encodeURIComponent(vendor)+inStores(mine.map(s=>s.id))+'&order=created_at.desc&limit=30');
        const c={};r.forEach(x=>c[x.store_id]=(c[x.store_id]||0)+1);
        _storeGuess[vendor]=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||null;
      }catch(e){_storeGuess[vendor]=null}
    }
    if(_storeGuess[vendor])return {id:_storeGuess[vendor],why:'前にも同じお店で使いました'};
  }
  const t=[vendor,...(texts||[])].filter(Boolean).join(' ');
  for(const s of mine){if(S.depts.some(d=>d.store_id===s.id&&(d.keywords||[]).some(k=>k&&t.includes(k))))return {id:s.id,why:'ことばから判断'}}
  if(typeof aiIdx==='number'&&mine[aiIdx])return {id:mine[aiIdx].id,why:'AIのよそう'};
  if(/タイヤ|オートバックス|イエローハット|ジェームス|部品|パーツ|オークション|USS|陸運|車検|自賠責|リサイクル券|板金|塗装/.test(t)){const s=mine.find(s=>bizOfStore(s.id)?.track_vehicles);if(s)return {id:s.id,why:'車の部品などなので'}}
  return {id:defaultEntryStoreId(),why:''};
}

// AIはサーバーの中継（keihi-ai）を通す。キーは端末に置かない
async function askClaude(tier,content,maxTokens,testKey){
  if(!testKey&&!apiKeyOk())throw new Error('AI読み取りキーが未設定です');
  let lastErr=null;
  for(const model of MODELS[tier]){
    const res=await callFn('keihi-ai',{model,max_tokens:maxTokens||1500,messages:[{role:'user',content}],test_key:testKey||undefined});
    if(res.ok){
      const d=res.data;
      const txt=(d.content||[]).map(c=>c.text||'').join('');
      const m=txt.replace(/```json|```/g,'').match(/[\[{][\s\S]*[\]}]/);
      if(!m)throw new Error('AIの返事を読めませんでした');
      return JSON.parse(m[0]);
    }
    const e=res.data||{};
    lastErr=new Error(e.error?.message||(typeof e.error==='string'?e.error:'')||('AIエラー '+res.status));
    // モデルが無い/使えないときだけ次のモデルへ
    if(!(res.status===404||(res.status===400&&/model/i.test(e.error?.message||''))))break;
  }
  throw lastErr||new Error('AIに接続できませんでした');
}

function readFileAsDataUrl(file){return new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ng;r.readAsDataURL(file)})}
function loadImg(src){return new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=src})}
// 大きい写真を縮める（長辺2048px・約4MB以下のJPEG）
async function compressImage(file,maxPx=2048){
  const src=await readFileAsDataUrl(file);
  const img=await loadImg(src);
  let w=img.width,h=img.height;
  if(file.size<3.5*1024*1024&&w<=maxPx&&h<=maxPx&&/jpe?g|png/.test(file.type))return src;
  const sc=Math.min(1,maxPx/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  let q=.85,out=c.toDataURL('image/jpeg',q);
  while(out.length*0.75>3.8*1024*1024&&q>.4){q-=.1;out=c.toDataURL('image/jpeg',q)}
  return out;
}
async function cropDataUrl(dataUrl,box){
  const img=await loadImg(dataUrl);
  const b=Object.assign({x1:0,y1:0,x2:1,y2:1},box||{});
  const x=Math.max(0,b.x1)*img.width,y=Math.max(0,b.y1)*img.height;
  const w=Math.max(10,(Math.min(1,b.x2)-Math.max(0,b.x1))*img.width),h=Math.max(10,(Math.min(1,b.y2)-Math.max(0,b.y1))*img.height);
  const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);
  c.getContext('2d').drawImage(img,x,y,w,h,0,0,w,h);
  return c.toDataURL('image/jpeg',.9);
}

function normAmount(v){

  const n=parseFloat(String(v).replace(/[円¥￥,\s]/g,''));return isNaN(n)?null:Math.round(n);

function normDate(d){
  if(!d)return null;d=String(d);
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  let m=d.match(/(\d{4})[年\/\-.](\d{1,2})[月\/\-.](\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  m=d.match(/R\s*(\d{1,2})[年\/\-.](\d{1,2})[月\/\-.](\d{1,2})/i)||d.match(/令和\s*(\d{1,2})年(\d{1,2})月(\d{1,2})/);
  if(m)return (2018+parseInt(m[1]))+'-'+pad(m[2])+'-'+pad(m[3]);
  m=d.match(/^(\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);if(m)return '20'+m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  return null;
}
const PAY_LABELS=['現金','カード','振込','アプリ','その他'];
function normPay(v){
  if(!v)return '現金';const s=String(v).toLowerCase();
  if(/現金|cash/.test(s))return '現金';
  if(/カード|クレジット|card|credit|visa|master|jcb|amex/.test(s))return 'カード';
  if(/振込|振り込み|transfer|bank/.test(s))return '振込';
  if(/paypay|アプリ|app|line ?pay|楽天|メルペイ|au ?pay|d払い|qr/.test(s))return 'アプリ';
  return PAY_LABELS.includes(v)?v:'その他';
}
function isCashPay(p){return !p||p==='現金'||p==='cash'}
</script>
<script>

function reportSales(r){return (r.cash_sales||0)+(r.card_sales||0)+(r.app_sales||0)+(r.other_income||0)}
function salesTotal(sales,filterFn){
  const rs=filterFn?sales.reports.filter(filterFn):sales.reports;
  const ar=filterFn?sales.ar.filter(filterFn):sales.ar;
  return sum(rs,reportSales)+sum(ar,a=>a.amount||0);

function feeOf(r){const s=storeById(r.store_id);return Math.round((r.card_sales||0)*(s?.card_fee_rate??3.24)/100)+Math.round((r.app_sales||0)*(s?.app_fee_rate??1.98)/100)}

// ===== 経費の種類（AIの学習つき） =====

  {kw:['食材','仕入','業務スーパー','食品','青果','精肉','鮮魚','酒販','米穀','肉','魚'],cat:'仕入高'},

  {kw:['水道','電力','電気','ガス','光熱','北電','北海道電力'],cat:'水道光熱費'},
  {kw:['修繕','修理','工事','設備'],cat:'修繕費'},
  {kw:['接待','会食','居酒屋','レストラン'],cat:'接待交際費'},
  {kw:['広告','宣伝','チラシ','印刷','Google','Meta','Instagram'],cat:'広告宣伝費'},
  {kw:['通信','電話','docomo','ドコモ','KDDI','ソフトバンク','インターネット','NTT'],cat:'通信費'},
  {kw:['家賃','賃料','リース','レンタル','駐車場'],cat:'地代家賃'},
  {kw:['給与','人件費','外注','バイト'],cat:'給与・外注費'},
  {kw:['JR','バス','タクシー','高速','ETC','航空','ホテル'],cat:'旅費交通費'},
  {kw:['手数料','振込料'],cat:'支払手数料'},
];
const _catLearnCache={};
async function guessCategory(vendor){
  if(!vendor)return null;
  if(_catLearnCache[vendor]!==undefined)return _catLearnCache[vendor];
  let found=null;
  try{
    const r=await db.get(`category_learning?select=category_id,confirmed_count&vendor_name=eq.${encodeURIComponent(vendor)}&order=confirmed_count.desc&limit=1`);
    if(r.length&&catById(r[0].category_id))found=r[0].category_id;
  }catch(e){}
  if(!found){
    // 学習データが無ければ、同じお店の過去の経費でいちばん多い種類
    try{
      const past=await db.get(`expenses?select=category_id&vendor_name=eq.${encodeURIComponent(vendor)}&category_id=not.is.null&order=created_at.desc&limit=30`);
      const cnt={};past.forEach(p=>{if(catById(p.category_id))cnt[p.category_id]=(cnt[p.category_id]||0)+1});
      const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(best)found=best;
    }catch(e){}
  }
  if(!found){
    const v=vendor.toLowerCase();
    for(const rule of CAT_RULES){
      if(rule.kw.some(k=>v.includes(k.toLowerCase()))){const c=S.cats.find(c=>c.name===rule.cat);if(c){found=c.id;break}}
    }
  }
  _catLearnCache[vendor]=found;
  return found;
}
async function learnCategory(vendor,catId){

  try{
    const ex=await db.get(`category_learning?select=id,confirmed_count&vendor_name=eq.${encodeURIComponent(vendor)}&category_id=eq.${catId}`);
    if(ex.length)await db.patch(`category_learning?id=eq.${ex[0].id}`,{confirmed_count:(ex[0].confirmed_count||0)+1,updated_at:new Date().toISOString()});
    else await db.post('category_learning',{vendor_name:vendor,category_id:catId,confirmed_count:1});
  }catch(e){}
}

// 部門：その店舗の部門のキーワードに当てはまるときだけ自動で付ける
function guessDept(storeId,texts){
  const t=texts.filter(Boolean).join(' ');if(!t)return null;
  let best=null,bestScore=0;
  S.depts.filter(d=>d.store_id===storeId).forEach(d=>{
    const score=(d.keywords||[]).filter(k=>k&&t.includes(k)).length;
    if(score>bestScore){best=d.id;bestScore=score}

}
// ===== 部門の学習 =====
// 人が部門を選んだ過去の経費を「お手本」にして、AIに部門を選ばせる。
// お手本が少ないうちはAIは選ばない（人が選ぶ）
const DEPT_MIN_EXAMPLES=5;
async function deptExamples(storeIds){
  const ids=storeIds.filter(id=>S.depts.filter(d=>d.store_id===id).length>=2);
  const out={};ids.forEach(id=>out[id]=[]);

      if(!r.vendor_name&&!r.memo)return;
      out[r.store_id].push({v:(r.vendor_name||'').slice(0,40),m:(r.memo||'').slice(0,60),d:dp.name});
    });
  }catch(e){}
  return out;
}
// AIに渡す説明文（お店ごとの部門とお手本）
function deptPromptHint(stores,ex){
  const parts=[];
  stores.forEach((s,k)=>{
    const ds=S.depts.filter(d=>d.store_id===s.id);
    const list=ex[s.id]||[];
    if(!deptNeed(s.id,ex).ready)return;
    parts.push(`お店${stores.length>1?k:''}「${s.name}」の部門: ${ds.map(d=>d.name).join(' / ')}\nスタッフが振り分けた例:\n`+list.map(x=>`- ${x.v||'?'}「${x.m||'?'}」→ ${x.d}`).join('\n'));
  });
  if(!parts.length)return '';
  return `\n\n部門の振り分け：例を参考に、買った品目から各書類の dept に部門名をそのまま入れる。お店の名前ではなく品目で判断する（同じお店でも品目で部門が変わる）。どちらとも言えないものは null。1枚に別々の部門の品目がまざっているときは dept を null にして dept_mixed を true。例がまだ少ない部門もある。例に無い部門でも、品目がはっきりその部門のものなら選んでよい。\n`+parts.join('\n\n');
}
const DEPT_MIN_EACH=2;
const DEPT_MIN_ANY=10;
// AIがおすすめを出してよいか：
//  ・合わせて5件以上、どの部門も2件以上
//  ・または、かたよっていても合わせて10件以上（車販がしばらく無い時期のため）
function deptNeed(storeId,ex){
  const ds=S.depts.filter(d=>d.store_id===storeId).sort(sortByOrder);
  const list=(ex&&ex[storeId])||[];
  const each=ds.map(d=>({name:d.name,left:Math.max(0,DEPT_MIN_EACH-list.filter(x=>x.d===d.name).length)})).filter(x=>x.left>0);
  const eachLeft=each.reduce((a,x)=>a+x.left,0);
  const leftA=Math.max(DEPT_MIN_EXAMPLES-list.length,eachLeft);
  const leftB=Math.max(0,DEPT_MIN_ANY-list.length);
  const left=Math.min(leftA,leftB);
  return {ready:ds.length>=2&&left===0,left,each:leftA<=leftB?each:[],count:list.length};
}
function deptByName(storeId,name){
  if(!name)return null;const n=String(name).trim();
  return S.depts.find(d=>d.store_id===storeId&&d.name===n)||null;

function downloadText(name,text,type='text/csv;charset=utf-8;'){
  const blob=new Blob(['﻿'+text],{type});const url=URL.createObjectURL(blob);

<script>
// ===== SCAN（撮影 → AIが読む → 確認して保存） =====
const SC={phase:'idle',img:null,docs:[],error:null,saved:0,failed:0,savedTo:{}};
function scanHasWork(){return SC.phase==='review'||SC.phase==='busy'}
function scanSyncStore(){renderScan()}
PAGES.scan=function(){
  if(SC.phase==='done')SC.phase='idle';
  renderScan();
};
const DOC_LABEL={receipt:'レシート・領収書',delivery_note:'納品書',invoice:'請求書',card_statement:'カード明細',other:'書類'};
function scanStoreField(){
  const cs=myStores();
  if(!cs.length)return '<div class="alert alert-w">担当のお店がありません。</div>';
  if(cs.length===1){const s=cs[0];return `<div class="alert alert-i" style="display:flex;align-items:center;gap:8px">${esc(s.icon||'🏪')} <b>${esc(s.name)}</b> の経費として登録します</div>`}
  return SC.phase==='idle'?`<div class="alert alert-i" style="font-size:13px">どのお店の経費かは、AIが自動で分けます。ちがっていたらボタンを押して直すだけです。</div>`:'';
}
// 1枚ずつ「どのお店？」を直す
function scanSetStore(storeId,i){
  collectScanDocs();const d=SC.docs[+i];if(!d)return;
  d.storeId=storeId;d.storeWhy='';d.storePicked=true;
  d.department_id=guessDept(storeId,[d.vendor_name,d.memo]);d.deptWhy=d.department_id?'kw':'';d.deptAi=null;d.deptMixed=false;
  renderScan();
}
function renderScan(){
  const el=$('page-scan');
  let h=pageHead('レシートを撮影','1枚でも、何枚か並べて撮ってもOK。AIが読み取ります');
  if(!apiKeyOk()){
    h+=`<div class="alert alert-w">AI読み取りキーがまだ設定されていません。${isOwner()?'設定 →「AI読み取りキー」で登録してください。':'オーナーに設定してもらってください。'}<br>写真なしで <a href="#" onclick="go('entry');return false" style="color:inherit;font-weight:700">手で入力</a> することもできます。</div>`;
    if(isOwner())h+=`<button class="btn btn-secondary" onclick="go('settings','ai')">AI読み取りキーを設定する</button>`;
    el.innerHTML=h;return;
  }
  h+=scanStoreField();
  if(SC.phase==='idle'){
    h+=`<div class="upload-grid">
      <button class="upload main" onclick="scanPick('cam')"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg><span>カメラで撮る</span></button>
      <button class="upload" onclick="scanPick('lib')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>写真をえらぶ</span></button>
    </div>
    <div class="alert alert-i" style="font-size:13px">コツ：レシートを机に並べて、真上から明るく撮るとよく読めます。</div>
    ${SC.error?`<div class="alert alert-d">${esc(SC.error)}</div>`:''}`;
  }else if(SC.phase==='busy'){
    h+=`<div class="scan-wrap"><img class="preview" src="${SC.img}" alt=""/><div class="scan-beam"></div></div><div class="busy"><div class="spinner"></div><div><div class="busy-title">AIが読み取っています...</div><div class="busy-sub">10〜20秒ほどかかります</div></div></div>`;
  }else if(SC.phase==='review'){
    const n=SC.docs.filter(d=>!d.skip).length;
    h+=`<div class="card-title" style="margin-top:4px">${SC.docs.length}件 見つかりました <button class="link-btn" onclick="scanReset()">撮り直す</button></div>
      <div class="hint" style="margin-bottom:10px">内容を確かめて、ちがうところは直してから保存してください。いらないものはチェックを外します。</div>`;
    h+=SC.docs.map((d,i)=>scanDocCard(d,i)).join('');
    h+=`<div class="btn-col" style="margin-top:6px"><button class="btn btn-green" id="sc-save" onclick="scanSave()" ${n?'':'disabled'}>${n}件を保存する</button><button class="btn btn-secondary" onclick="scanReset()">やめて撮り直す</button></div>`;
  }else if(SC.phase==='done'){
    h+=`<div style="text-align:center;padding:24px 0">
      <div style="font-size:52px">✅</div>
      <div style="font-size:20px;font-weight:700;color:var(--green);margin:6px 0">${SC.saved}件 保存しました</div>
      ${myStores().length>1?`<div class="hint">${Object.entries(SC.savedTo).map(([id,n])=>esc(unitLabel(storeById(id)))+' '+n+'件').join(' ・ ')}</div>`:''}
      ${SC.failed?`<div class="alert alert-w">${SC.failed}件は保存できませんでした。もう一度ためしてください。</div>`:''}
      <div class="btn-col" style="margin-top:14px"><button class="btn btn-primary" onclick="scanReset()">続けて撮影する</button><button class="btn btn-secondary" onclick="go('list','pending')">経費の一覧を見る</button></div>
    </div>`;
  }
  el.innerHTML=h;
}
function scanDocCard(d,i){
  const conf=d.confidence??0.8;
  const confCls=conf>=0.85?'conf-h':conf>=0.65?'conf-m':'conf-l';
  const low=conf<0.75&&!d.skip;
  const isCard=d.type==='card_statement';
  const deptSel=deptButtonsHtml(`d${i}-dept`,d.storeId,d.department_id,`scanPickDept.bind(null,${i})`);
  const multi=myStores().length>1;
  return `<div class="doc-card ${d.skip?'skip':''} ${low?'low':''}" id="doc-${i}">
    <div class="doc-head">
      <input type="checkbox" ${d.skip?'':'checked'} onchange="scanToggle(${i},this.checked)" aria-label="保存する"/>
      <div style="flex:1;min-width:0"><div style="font-weight:700">${DOC_LABEL[d.type]||'書類'} ${SC.docs.length>1?(i+1):''}</div></div>
      <span class="conf ${confCls}">読み取り ${Math.round(conf*100)}%</span>
    </div>
    ${d.thumb?`<img class="doc-thumb" src="${d.thumb}" alt=""/>`:''}
    ${multi&&!isCard?`<div class="label" style="margin-bottom:6px">どのお店の経費？</div>${unitButtons(d.storeId,'scanSetStore',{arg:i})}${d.storeWhy?`<div class="guess-note">AIがえらびました（${esc(d.storeWhy)}）</div>`:''}`:''}
    ${isCard?`<div class="alert alert-i" style="font-size:13px">カード明細は1行ずつ登録するので${isOwner()?'「カード明細の取込」を使ってください。 <a href="#" onclick="go(\'cards\');return false" style="font-weight:700;color:inherit">開く ›</a>':'オーナーに渡してください。'}</div>`:''}
    ${low?'<div class="alert alert-w" style="font-size:13px">読み取りに自信がありません。数字を確かめてください。</div>':''}
    ${d.noDate?'<div class="hint" style="margin:-4px 0 8px">日付が読めなかったので今日の日付にしています</div>':''}
    <div class="field"><div class="label">金額</div><div class="yen-wrap"><span>¥</span><input class="input big ai num" id="d${i}-total" inputmode="numeric" value="${d.total??''}"/></div></div>
    <div class="field"><div class="label">お店・取引先</div><input class="input ai" id="d${i}-vendor" value="${esc(d.vendor_name||'')}" placeholder="例: ENEOS 帯広店"/></div>
    <div class="g2">
      <div class="field"><div class="label">日付</div><input class="input ai" type="date" id="d${i}-date" value="${esc(d.date||'')}"/></div>
      <div class="field"><div class="label">払い方</div>${paySelectHtml(`d${i}-pay`,d.payment_method)}</div>
    </div>
    <div class="field"><div class="label">何を買った？（メモ）</div><input class="input" id="d${i}-memo" value="${esc(d.memo||'')}" placeholder="例: ガソリン 40L"/></div>
    ${deptSel?`<div class="field ${d.department_id?'':'dept-need'}"><div class="label">部門${d.department_id?'':'（えらんでください）'}</div>${deptSel}${scanDeptNote(d)}</div>`:''}
    <div class="field"><div class="label">経費の種類</div>${catSelectHtml(`d${i}-cat`,d.category_id)}</div>
  </div>`;
}
function scanDeptNote(d){
  if(d.deptMixed&&!d.department_id)return '<div class="guess-note warn">ちがう部門の物がまざっているようです。金額の多いほうをえらんでください</div>';
  const n=(SC.deptEx&&SC.deptEx[d.storeId]||[]).length;
  if(d.department_id&&d.deptWhy==='ai')return `<div class="guess-note">AIのおすすめ（これまでの振り分け ${n}件から学習）。ちがっていたら押して直してください</div>`;
  if(d.department_id)return '';
  if(SC.deptEx&&SC.deptEx[d.storeId]){const nd=deptNeed(d.storeId,SC.deptEx);
    if(!nd.ready)return `<div class="guess-note">えらんだ結果をAIが覚えます。あと ${nd.left}件 えらぶと、AIがおすすめを出すようになります${nd.each.length?'（'+nd.each.map(x=>esc(x.name)+' があと'+x.left+'件').join('・')+'）':''}</div>`}
  return '';
}
function scanPickDept(i,id){
  collectScanDocs();const d=SC.docs[+i];if(!d)return;
  d.department_id=d.department_id===id?null:id;d.deptWhy='human';
  renderScan();
}
function scanToggle(i,on){collectScanDocs();SC.docs[i].skip=!on;renderScan()}
function collectScanDocs(){
  SC.docs.forEach((d,i)=>{
    if(!$(`d${i}-total`))return;
    d.total=normAmount($(`d${i}-total`).value);
    d.vendor_name=$(`d${i}-vendor`).value.trim();
    d.date=$(`d${i}-date`).value||null;
    d.payment_method=$(`d${i}-pay`).value;
    d.memo=$(`d${i}-memo`).value.trim();
    d.category_id=$(`d${i}-cat`).value||null;
    d.department_id=$(`d${i}-dept`)?.value||null;
  });
}
function scanReset(){SC.phase='idle';SC.img=null;SC.docs=[];SC.error=null;renderScan()}
async function scanPick(kind){
  const f=await pickFile(kind);if(!f)return;
  SC.error=null;SC.savedTo={};
  try{SC.img=await compressImage(f)}catch(e){SC.error='写真を開けませんでした';renderScan();return}
  SC.phase='busy';renderScan();
  try{
    const mine=myStores();
    const hint=mine.length>1?`\n\nこの会社のお店（store_index で、どのお店の経費らしいかを0からの番号で答える。わからなければ null）:\n`+mine.map((s,k)=>`${k}: ${unitLabel(s)}（${s.name}）`).join('\n'):'';
    const ex=await deptExamples(mine.map(s=>s.id));SC.deptEx=ex;
    const r=await askClaude('read',imgContent(SC.img,SCAN_PROMPT+hint+deptPromptHint(mine,ex)),2500);
    const list=(r.documents||[]).filter(x=>x&&(x.total!=null||x.vendor_name));
    if(!list.length)throw new Error('レシートが見つかりませんでした。もう少し近づいて撮ってみてください。');
    const docs=[];
    for(const x of list){
      const d={
        type:x.type||'receipt',
        vendor_name:(x.vendor_name||'').trim(),
        date:normDate(x.date),
        total:normAmount(x.total),
        tax_8:normAmount(x.tax_8),tax_10:normAmount(x.tax_10),subtotal:normAmount(x.subtotal),
        payment_method:normPay(x.payment_method),
        memo:(x.memo||'').trim(),
        registration_number:x.registration_number||null,
        confidence:typeof x.confidence==='number'?x.confidence:0.8,
        raw:x,skip:x.type==='card_statement',
      };
      if(!d.date){d.date=ymd();d.noDate=true}
      d.thumb=list.length>1?await cropDataUrl(SC.img,x.crop):SC.img;
      d.category_id=await guessCategory(d.vendor_name);
      const g=await guessStore(d.vendor_name,[d.memo],typeof x.store_index==='number'?x.store_index:null);
      d.storeId=g.id;d.storeWhy=g.why;
      const ai=deptNeed(d.storeId,ex).ready?deptByName(d.storeId,x.dept):null;
      d.deptAi=ai?ai.id:null;d.deptMixed=!!x.dept_mixed;
      if(ai){d.department_id=ai.id;d.deptWhy='ai'}
      else{d.department_id=d.deptMixed?null:guessDept(d.storeId,[d.vendor_name,d.memo]);d.deptWhy=d.department_id?'kw':''}
      docs.push(d);
    }
    SC.docs=docs;SC.phase='review';
  }catch(e){SC.phase='idle';SC.error='読み取れませんでした：'+e.message}
  if(S.page==='scan')renderScan();
}
const SCAN_PROMPT=`この写真に写っている書類（レシート・領収書・納品書・請求書・カード明細など）をすべて読み取り、JSONだけを返してください。説明文は不要です。
{"documents":[{"type":"receipt|delivery_note|invoice|card_statement|other","vendor_name":"店名・会社名","date":"YYYY-MM-DD","total":1234,"tax_8":null,"tax_10":null,"subtotal":null,"payment_method":"現金|カード|振込|アプリ|不明","memo":"主な品目を短く","registration_number":null,"crop":{"x1":0,"y1":0,"x2":1,"y2":1},"confidence":0.9,"store_index":null,"dept":null,"dept_mixed":false}]}
ルール:
- 金額は数字だけ（円・カンマなし）。読めない項目は null（推測しない）
- 和暦は西暦に直す（令和7年=2025年）
- memo は買った物・サービスを短く（例「REガソリン 40L」「食材」「洗車用洗剤」）。クーポン・注意書き・ポイントは書かない
- registration_number はインボイス登録番号（T＋13桁）があれば
- crop は写真全体を1×1とした各書類の位置。書類どうし重ならないように。1件だけなら {"x1":0,"y1":0,"x2":1,"y2":1}
- confidence は合計金額と日付をどれだけ確実に読めたか（0〜1）
- store_index はお店の一覧があるときだけ（無ければ null）
- dept・dept_mixed は部門の振り分けの説明があるときだけ（無ければ null と false）`;
async function scanSave(){
  collectScanDocs();
  const list=SC.docs.filter(d=>!d.skip);
  const bad=list.findIndex(d=>!d.total);
  if(bad>=0){toast('金額が入っていないものがあります','err');document.getElementById('doc-'+SC.docs.indexOf(list[bad]))?.scrollIntoView({behavior:'smooth',block:'center'});return}
  const btn=$('sc-save');btn.disabled=true;
  let ok=0,ng=0;
  for(let i=0;i<list.length;i++){
    const d=list[i];btn.textContent=`保存しています... (${i+1}/${list.length})`;
    try{
      const up=await uploadImage(dataUrlToBlob(d.thumb||SC.img),'scan');
      await db.post('expenses',{
        store_id:d.storeId,doc_type:d.type==='other'?'receipt':d.type,
        vendor_name:d.vendor_name||null,date:d.date,total:d.total,
        tax_8:d.tax_8,tax_10:d.tax_10,subtotal:d.subtotal,
        payment_method:d.payment_method,memo:d.memo||null,
        invoice_number:d.registration_number,
        department_id:d.department_id,category_id:d.category_id,
        status:'pending',image_url:up.url,image_path:up.path,
        ai_confidence:{overall:d.confidence,dept_ai:d.deptAi||null,dept_mixed:!!d.deptMixed},ai_raw:d.raw,created_by:S.user.username,
      });
      if(d.vendor_name){learnCategory(d.vendor_name,d.category_id);learnDocType(d.vendor_name,d.type);forgetStoreGuess(d.vendor_name)}
      SC.savedTo[d.storeId]=(SC.savedTo[d.storeId]||0)+1;
      ok++;
    }catch(e){ng++;console.error(e)}
  }
  SC.saved=ok;SC.failed=ng;SC.phase='done';SC.docs=[];SC.img=null;
  toast(ok+'件 保存しました','ok');
  renderScan();
}
</script>
<script>
// ===== ENTRY（経費をまとめて手で入力） =====
// どのお店の分かは、お店の名前を入れると自動で決まる（前に使ったお店）。ちがえばボタンで直す。

    <div class="card" style="padding:12px 16px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700">合計</span><span class="amount" id="en-total" style="font-size:20px">¥0</span></div><div id="en-split" class="hint"></div></div>
    <div id="en-status"></div>

  entryTotal();

}
function entryPay(p){collectEntryRows();EN.pay=p;renderEntry()}
function collectEntryRows(){
  EN.rows.forEach(r=>{
    if(!$('er-date-'+r.id))return;
    r.date=$('er-date-'+r.id).value;r.amount=$('er-amt-'+r.id).value;r.vendor=$('er-ven-'+r.id).value;
